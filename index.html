<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="소리부터">
<meta name="description" content="글자와 소리부터 시작하는 성인 영어 첫걸음. 하루 20분, 나에게 맞는 파닉스와 복습.">
<title>소리부터 · 나의 영어 첫걸음</title>
<style>
:root {
  --bg:#f7f8f2; --paper:#fff; --ink:#203b33; --muted:#66776f;
  --green:#267359; --mint:#e6f2e8; --lime:#d9edab;
  --line:#e0e6dc; --shadow:0 8px 28px #263e3210;
}
* { box-sizing:border-box }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  line-height:1.6; word-break:keep-all;
}
button {
  font:inherit; cursor:pointer; color:inherit;
  touch-action:manipulation; min-height:48px;
}
button:disabled { cursor:default; opacity:.5 }
button:focus-visible,a:focus-visible {
  outline:3px solid #d28c36; outline-offset:4px;
}
h1,h2,h3,p { margin:0 }
h1 {
  font-size:clamp(28px,7vw,38px); line-height:1.3;
  letter-spacing:-1.5px;
}
h2 { font-size:24px; line-height:1.4; letter-spacing:-.6px }
h3 { font-size:18px }
small,.small { font-size:13px; color:var(--muted) }
a { color:var(--green) }
.shell { max-width:540px; margin:auto; padding:0 24px 112px }
.top {
  height:86px; display:flex; align-items:center;
  justify-content:space-between;
}
.brand {
  border:0; background:none; padding:0; display:flex;
  gap:9px; align-items:center; font-size:21px;
  font-weight:850; letter-spacing:-1px;
}
.brand-mark {
  display:grid; place-items:center; width:32px; height:35px;
  border-radius:12px 12px 12px 3px;
  background:var(--green); color:var(--lime); font-size:24px;
}
.streak {
  display:flex; align-items:center; gap:6px;
  font-weight:700; font-size:14px; background:#fff5e7;
  border:1px solid #f3e4cc; border-radius:20px; padding:6px 13px;
}
.eyebrow {
  color:var(--green); font-size:13px; font-weight:750;
  letter-spacing:1px; margin-bottom:12px;
}
.muted { color:var(--muted) }
.intro { padding:18px 0 22px }
.intro p { margin-top:14px; color:var(--muted); font-size:15px }
.card {
  background:var(--paper); border:1px solid var(--line);
  border-radius:24px; padding:22px; box-shadow:var(--shadow);
}
.hero {
  position:relative; overflow:hidden; background:var(--mint);
  border:1px solid #d5e4d4; border-radius:28px;
  padding:25px 24px 22px; margin-bottom:20px;
}
.hero-top {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.hero h2 { font-size:25px }
.hero p { font-size:14px; color:#506e5d; margin-top:9px }
.tag {
  display:inline-block; border-radius:8px; padding:3px 8px;
  background:#fff9; color:#426149; font-size:12px;
  font-weight:700; margin-bottom:11px;
}
.sprout { width:128px; height:130px; flex-shrink:0 }
.btn {
  display:flex; align-items:center; justify-content:center; gap:9px;
  width:100%; border-radius:14px; padding:13px 18px;
  font-size:16px; font-weight:750; border:1px solid var(--line);
  background:#fff; text-decoration:none;
}
.btn.primary {
  background:var(--green); color:#fff; border-color:var(--green);
  box-shadow:0 3px 0 #194e3d;
}
.btn.secondary {
  background:var(--mint); border-color:#d4e5d6; color:var(--green);
}
.btn.text {
  background:transparent; border:0; color:var(--muted);
  font-size:14px; box-shadow:none;
}
.btn+.btn { margin-top:12px }
.hero .btn { margin-top:22px }
.section-title {
  display:flex; justify-content:space-between;
  align-items:center; margin:26px 0 12px;
}
.section-title h2 { font-size:17px }
.progress {
  height:9px; overflow:hidden; border-radius:20px; background:#edf0e8;
}
.progress span {
  display:block; height:100%; background:var(--green);
  border-radius:inherit; transition:width .3s;
}
.goal {
  display:flex; justify-content:space-between;
  align-items:center; margin-bottom:13px;
}
.goal strong { font-size:15px }
.goal b { font-size:14px; color:var(--green) }
.goal-card p { margin-top:11px; font-size:13px; color:var(--muted) }
.review-card {
  display:flex; gap:14px; align-items:center;
  padding:17px 19px; margin-top:12px;
}
.review-icon {
  width:46px; height:48px; display:grid; place-items:center;
  background:#f8eddf; border-radius:15px; font-size:23px;
}
.review-card strong { font-size:15px }
.review-card p { font-size:12px; color:var(--muted); margin-top:3px }
.icon-btn {
  border:0; background:none; font-size:23px;
  width:48px; min-width:48px; border-radius:12px;
}
.note {
  font-size:12px; line-height:1.7; color:var(--muted);
  margin-top:18px; text-align:center;
}
.nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:540px; background:#fffffff5;
  backdrop-filter:blur(14px); border-top:1px solid var(--line);
  display:flex; justify-content:space-around;
  padding:10px 12px max(12px,env(safe-area-inset-bottom)); z-index:5;
}
.nav button {
  border:0; background:none; width:24%; display:flex;
  flex-direction:column; gap:2px; align-items:center;
  font-size:11px; color:var(--muted); border-radius:12px; padding:7px;
}
.nav button svg {
  width:22px; height:22px; fill:none;
  stroke:currentColor; stroke-width:1.8;
}
.nav button.active {
  color:var(--green); background:var(--mint); font-weight:800;
}
.stack { display:grid; gap:14px }
.course {
  display:flex; gap:14px; align-items:center; text-align:left;
  width:100%; padding:19px; border-radius:20px;
  background:white; border:1px solid var(--line);
}
.course.locked { background:#f0f1eb; color:#7f8a82 }
.course .badge {
  display:grid; place-items:center; width:47px; height:49px;
  flex-shrink:0; background:var(--mint); border-radius:15px;
  font-size:19px; font-weight:800;
}
.course strong { display:block; font-size:16px }
.course small { display:block; margin-top:4px }
.course .progress { margin-top:10px; height:5px }
.grow { flex:1 }
.back { display:flex; gap:10px; align-items:center; margin:3px 0 22px }
.back .icon-btn { background:#fff; border:1px solid var(--line); font-size:20px }
.back h2 { font-size:19px }
.lesson-list { margin-top:20px }
.lesson-list .btn { justify-content:space-between; text-align:left }
.flow-top { display:flex; gap:12px; align-items:center; margin:0 0 12px }
.flow-top .progress { flex:1 }
.flow-meta {
  display:flex; justify-content:space-between;
  font-size:12px; color:var(--muted); margin-bottom:25px;
}
.study {
  text-align:center; min-height:325px; display:flex;
  flex-direction:column; justify-content:center; align-items:center;
  gap:15px; margin:20px 0; padding:25px 16px;
}
.word {
  font-size:clamp(46px,13vw,68px); font-weight:800;
  letter-spacing:2px; line-height:1.3; word-break:normal;
}
.sentence { font-size:30px; letter-spacing:0 }
.meaning { font-size:23px; font-weight:750 }
.emoji { font-size:75px; line-height:1.3 }
.sound-grid { display:flex; gap:8px; justify-content:center; flex-wrap:wrap }
.sound-tile {
  background:var(--mint); border:1px solid #cbded0;
  border-radius:16px; min-width:60px; padding:12px 10px;
  font-size:28px; font-weight:750;
}
.sound-tile small { display:block; font-size:12px; font-weight:500 }
.hint { font-size:15px; color:var(--muted); max-width:360px }
.audio { display:flex; gap:10px; width:100%; justify-content:center; margin:7px 0 }
.audio .btn { font-size:14px; width:auto; flex:1; margin:0; padding:12px 8px }
.feedback {
  padding:16px 18px; background:var(--mint); border-radius:16px;
  margin:18px 0; color:#24533b;
}
.feedback.wrong { background:#fff0df; color:#785032 }
.feedback p { font-size:14px; margin-top:4px }
.options { display:grid; gap:11px; margin:22px 0 }
.choice {
  width:100%; text-align:left; border:2px solid var(--line);
  border-radius:16px; background:white; padding:15px 17px;
  display:flex; align-items:center; gap:12px; min-height:61px;
}
.choice.selected { border-color:var(--green); background:var(--mint) }
.choice.correct { border-color:var(--green); background:#e4f3e0 }
.choice.incorrect { border-color:#c9825d; background:#fff0e3 }
.choice .bubble {
  width:25px; height:25px; border:1px solid #a8b8ad; border-radius:50%;
  flex-shrink:0; display:grid; place-items:center; font-size:12px;
}
.choice .word-choice { font-size:22px; font-weight:700; word-break:normal }
.audio-choice { display:flex; gap:8px }
.audio-choice .choice { flex:1 }
.listen {
  border:1px solid #ccd8ce; background:#eef5ec;
  min-width:86px; border-radius:16px; padding:10px; font-size:13px;
}
.listen:disabled { opacity:.8 }
.quiet { font-size:12px; color:var(--muted); line-height:1.8 }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:22px 0 }
.stat {
  background:white; border:1px solid var(--line);
  border-radius:18px; padding:20px 8px; text-align:center;
}
.stat b { display:block; font-size:27px; color:var(--green) }
.stat span { font-size:12px; color:var(--muted) }
.weak { display:flex; gap:15px; align-items:center; margin:16px 0 }
.weak strong { min-width:38px; font-size:20px }
.weak .progress { flex:1 }
.weak small { min-width:76px; text-align:right }
.celebration { text-align:center; padding:35px 0 20px }
.celebration .medal { font-size:80px; display:block; margin-bottom:18px }
.celebration p { margin:15px 0 25px; color:var(--muted) }
.pills { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin:12px 0 22px }
.pill { background:var(--mint); padding:5px 10px; border-radius:8px; font-size:13px }
.toast {
  position:fixed; left:50%; bottom:105px; transform:translateX(-50%);
  max-width:440px; width:calc(100% - 40px); background:#203b33;
  color:white; padding:13px 18px; border-radius:14px;
  font-size:14px; z-index:20; text-align:center;
}
.storage-warning {
  background:#fff0df; color:#79502f; padding:12px;
  font-size:13px; border-radius:12px; margin-bottom:15px;
}
.confetti {
  position:fixed; top:-12px; width:10px; height:16px;
  pointer-events:none; z-index:10; animation:fall 2.4s ease-in forwards;
}
@keyframes fall {
  to { transform:translateY(100vh) rotate(540deg); opacity:0 }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important }
}
@media(max-width:370px) {
  .shell { padding-left:17px; padding-right:17px }
  .sprout { width:95px }
  .hero { padding:20px }
  .hero h2 { font-size:22px }
  .sound-tile { min-width:49px }
  .audio .btn { font-size:12px }
}
[hidden] { display:none!important }

/* ===== 실전 챕터·새 활동용 스타일 ===== */
html { -webkit-text-size-adjust:100% }
.shell, main { overflow-wrap:anywhere }
.btn { min-height:48px }
.btn.small-btn { width:auto; flex:1; font-size:14px; padding:10px 8px; margin:0 }
.btn+.btn { margin-top:12px }
.audio .btn+.btn { margin-top:0 }
.tools { display:flex; gap:10px; margin:12px 0 4px }
.tools .btn+.btn { margin-top:0 }
.word-small { font-size:30px; font-weight:800; letter-spacing:1px; word-break:normal }
.word.sentence { font-size:clamp(22px,7vw,30px) }
.study { min-height:0 }
.study.card { margin:16px 0 }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; text-align:center }
.two > div { background:#f7faf5; border-radius:16px; padding:12px 8px }
.urow { display:flex; gap:6px; justify-content:center; flex-wrap:wrap }
.u { min-width:44px; padding:6px 10px; border-radius:12px; font-size:clamp(26px,9vw,36px); font-weight:800; background:var(--mint); border:2px solid #cfe1d3; line-height:1.2 }
.u.v { background:#fdebd5; border-color:#f0d3aa }
.u.dg { background:var(--lime); border-color:#bcd77d }
.u.mv { background:#fdebd5; border-color:#f0d3aa }
.u.se, .u.sil { background:#f1f1ec; border:2px dashed #b9c1b8; color:#8a948d }
.u.blank { background:#fff; border-style:dashed; color:var(--muted) }
.grow2 { display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; font-size:14px; color:var(--muted) }
.grow2 .g { border-radius:10px; padding:2px 10px; background:#eef3ea; font-weight:700; color:var(--ink) }
.sbox { display:flex; gap:8px; justify-content:center; flex-wrap:wrap }
.sb { min-width:64px; border-radius:16px; border:2px solid #cfe1d3; background:var(--mint); padding:10px 12px; font-size:30px; font-weight:800 }
.sb small { display:block; font-size:11px; font-weight:600; color:var(--muted) }
.sb.dg { background:var(--lime); border-color:#bcd77d }
.sb.v, .sb.mv { background:#fdebd5; border-color:#f0d3aa }
.sb.sil { background:#f1f1ec; border:2px dashed #b9c1b8; color:#8a948d; display:grid; place-items:center }
.sound-tile { cursor:pointer }
.recap { display:flex; gap:8px; flex-wrap:wrap; justify-content:center }
.recap .sound-tile { font-size:20px; min-width:56px }
.plist { display:grid; gap:10px; width:100% }
.prow { display:grid; grid-template-columns:70px 1fr; gap:2px 12px; text-align:left; align-items:center; border:1px solid var(--line); background:#fff; border-radius:14px; padding:10px 14px }
.prow b { font-size:24px; grid-row:span 2 }
.prow span { font-weight:700 }
.prow small { grid-column:2 }
.helpbox { margin:10px 0; padding:10px 12px; background:#f7faf5; border-radius:14px; border:1px dashed #cfdcd0 }
.helpbox .btn.text { min-height:44px }
.helpbox .btn+.btn { margin-top:6px }
.wtray { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:100% }
.wbtn { border:1px solid var(--line); background:#fff; border-radius:12px; padding:8px 12px; min-width:48px; font-size:17px; font-weight:700 }
.sent, .ptext { font-size:clamp(20px,6vw,26px); line-height:1.7; text-align:left; word-break:normal; margin:2px 0 }
.passage { text-align:left; width:100% }
.passage .sent { font-size:clamp(19px,5.6vw,24px); padding:3px 6px; border-radius:10px }
.ptext { background:#fafcf8; border-radius:14px; padding:12px }
.ptrans { font-size:14px; color:var(--muted); background:#f7faf5; border-radius:12px; padding:10px 12px; text-align:left; margin-top:8px }
.speaking .now { background:var(--lime); border-radius:6px }
.sentence-on, .speaking.sentence-on { background:var(--lime); border-radius:10px }
.slots { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0 14px }
.slot { min-width:52px; height:60px; border:2px dashed #b9c9bd; background:#fff; border-radius:14px; font-size:28px; font-weight:800; padding:0 8px }
.slot.filled { border-style:solid; border-color:var(--green); background:var(--mint) }
.slot.good { border-color:var(--green); background:#e4f3e0 }
.slot.bad { border-color:#c9825d; background:#fff0e3 }
.bank { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0 }
.tile { min-width:52px; height:56px; border:2px solid var(--line); background:#fff; border-radius:14px; font-size:26px; font-weight:800; padding:0 10px; box-shadow:0 2px 0 var(--line) }
.tile.used { opacity:.35; border-style:dashed }
.typed { width:100%; font:inherit; font-size:32px; font-weight:800; text-align:center; letter-spacing:3px; min-height:60px; border:2px solid var(--line); border-radius:16px; padding:6px 10px; background:#fff }
.typed:focus { border-color:var(--green); outline:none }
label.small { display:block; margin-bottom:8px }
.chainpair { display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap }
.chainpair .word { font-size:clamp(34px,10vw,48px) }
.word-choice { font-size:22px; font-weight:700; word-break:normal }
.audio-choice { display:flex; gap:8px; align-items:stretch }
.audio-choice .choice { flex:1; min-width:0 }
.chcard { padding:16px }
.chcard.locked { background:#f0f1eb; color:#7f8a82 }
.chhead { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px }
.chbtn { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px }
.chbtn .btn { margin:0; font-size:14px; padding:10px 6px }
.chbtn .btn:only-child { grid-column:1 / -1 }
.mrow { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line) }
.mrow:first-of-type { border-top:0 }
.mrow strong { display:block; font-size:15px }
.mrow small { display:block; color:var(--muted); line-height:1.5 }
.mrow b { color:var(--green); font-size:20px; white-space:nowrap }
.lesson-list .card .small { margin:0 }
.feedback .urow, .feedback .grow2 { justify-content:flex-start; margin-top:8px }
.feedback .u { font-size:24px; min-width:36px; padding:3px 8px }
.feedback .audio { justify-content:flex-start }
.feedback .audio .btn { flex:0 1 auto }
.emoji { display:block }
@media(max-width:370px) {
  .shell { padding-left:14px; padding-right:14px }
  .u { min-width:36px; padding:4px 6px }
  .slot, .tile { min-width:46px }
  .sb { min-width:54px; padding:8px }
  .two { grid-template-columns:1fr }
  .prow { grid-template-columns:56px 1fr }
  .chbtn { grid-template-columns:1fr }
  .listen { min-width:70px }
  .audio { flex-wrap:wrap }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <button class="brand" data-action="home" aria-label="소리부터 홈">
      <span class="brand-mark" aria-hidden="true">♪</span>소리부터
    </button>
    <span id="streak" class="streak"></span>
  </header>
  <div id="storage-warning" class="storage-warning" hidden>
    기기 저장 공간을 사용할 수 없어요. 현재 학습은 가능하지만
    창을 닫으면 기록이 사라질 수 있어요.
  </div>
  <main id="app" tabindex="-1"></main>
</div>
<nav id="nav" class="nav" aria-label="주요 메뉴"></nav>
<div id="toast" class="toast" role="status" hidden></div>


<script>
// ===== 기존 1~5단계 데이터 (ID 규칙 유지: `${level}-${index}`, 문장은 `5-s${i}`) =====
// 글자 소리 안내. [가까운 한글 소리 힌트, (미사용 예약), 입 모양 설명]
// 한글은 영어 발음의 정답 기준이 아니라 "가까운 힌트"예요.
const SOUNDS = {
  a:['애','','입을 넓게 벌려 짧게 내요. cat의 가운데 소리예요.'],
  b:['ㅂ','','입술을 붙였다 짧게 떼요. 뒤에 긴 으를 붙이지 않아요.'],
  c:['ㅋ','','목 뒤에서 공기를 짧게 터뜨려요. 여기서는 cat의 소리예요.'],
  d:['ㄷ','','혀끝을 윗잇몸에 댔다 떼요.'],
  e:['에','','입을 조금 벌려 짧게 에.'],
  f:['ㅍ 비슷','','윗니를 아랫입술에 살짝 대고 바람을 내요. ㅍ과 달라요.'],
  g:['ㄱ','','목 뒤에서 소리를 내요. 여기서는 go의 첫소리예요.'],
  h:['ㅎ','','입을 열고 따뜻한 숨을 내요.'],
  i:['짧은 이','','입에 힘을 빼요. 길게 이이 하지 않아요.'],
  j:['ㅈ','','혀를 뗄 때 소리와 바람을 함께 내요.'],
  k:['ㅋ','','목 뒤에서 공기를 터뜨려요.'],
  l:['ㄹ 비슷','','혀끝을 윗잇몸에 대요. 한국어 ㄹ과 똑같지는 않아요.'],

// ===== 순수 함수 모음 (DOM 없이 동작: 앱과 검증 스크립트가 함께 사용) =====
const VOWELS = ['a','e','i','o','u'];

function parseUnits(notation) {
  return notation.split('|').map(u => {
    if (u[0] === '+') return {k:'+'+u.slice(1), t:u.slice(1), kind:'inf', sil:false};
    if (u.endsWith('+')) return {k:u[0]+'_e', t:u[0], kind:'mv', sil:false};
    if (u.endsWith('~')) return {k:'e~', t:'e', kind:'se', sil:true};
    if (u === 'th0') return {k:'th0', t:'th', kind:'dg', sil:false};
    if (['sh','ch','th','ck'].includes(u)) return {k:u, t:u, kind:'dg', sil:false};
    if (VOWELS.includes(u)) return {k:u, t:u, kind:'v', sil:false};
    return {k:u, t:u, kind:'c', sil:false};
  });
}

function wordUnits(word) {
  const n = LEX[String(word).toLowerCase()];
  return n ? parseUnits(n) : null;
}

const unitsText = us => us.map(u => u.t).join('');
const soundCount = us => us.filter(u => u.kind !== 'se').length;

// 소리 묶음: 마법의 e는 모음과 끝 e를 하나의 묶음으로 묶고, sh/ch/th/ck는 두 글자 한 칸이에요.
function soundGroups(us) {
  const groups = [];
  const used = new Set();
  us.forEach((u,i) => {
    if (used.has(i) || u.kind === 'se') return;
    if (u.kind === 'mv') {
      const j = us.findIndex((x,idx) => idx > i && x.kind === 'se');
      used.add(i);
      if (j >= 0) used.add(j);
      groups.push({idx:j >= 0 ? [i,j] : [i], label:u.t+'…e', k:u.k, kind:'mv'});
      return;
    }
    used.add(i);
    groups.push({idx:[i], label:u.t, k:u.k, kind:u.kind});
  });
  return groups;
}

// 이 단어를 읽으려면 몇 회차까지의 규칙이 필요한지 계산
function minSession(us) {
  let m = 1;
  let prevCons = false;
  us.forEach(u => {
    const k = u.k;
    if (['i','o','u'].includes(k)) m = Math.max(m,2);
    if (k === 'sh' || k === 'ch') m = Math.max(m,3);
    if (k === 'th' || k === 'th0' || k === 'ck') m = Math.max(m,4);
    if (k === 'a_e') m = Math.max(m,5);
    if (k === 'i_e') m = Math.max(m,6);
    if (k === 'o_e' || k === 'u_e') m = Math.max(m,7);
    const cons = u.kind === 'c' || u.kind === 'dg';
    if (cons && prevCons) m = Math.max(m,8);
    if (u.kind === 'inf') { return; }
    prevCons = cons;
  });
  return m;
}

const tokensOf = s => (String(s).match(/[A-Za-z]+/g) || []).map(w => w.toLowerCase());

// 두 단어가 어떻게 다른지 (단어 사슬 문제용)
function diffWords(a, b) {
  const A = wordUnits(a), B = wordUnits(b);
  if (!A || !B) return null;
  const strip = us => us.filter(u => u.kind !== 'se');
  const hasE = us => us.some(u => u.kind === 'se');
  const ta = strip(A).map(u => u.t), tb = strip(B).map(u => u.t);
  const sameBase = ta.length === tb.length && ta.every((x,i) => x === tb[i]);
  if (sameBase && !hasE(A) && hasE(B)) return {type:'addE'};
  if (sameBase && hasE(A) && !hasE(B)) return {type:'dropE'};
  const posOf = (i,len) => i === 0 ? 'first' : i === len-1 ? 'last' : 'mid';
  if (hasE(A) === hasE(B)) {
    if (ta.length === tb.length) {
      const d = ta.map((x,i) => x !== tb[i] ? i : -1).filter(i => i >= 0);
      if (d.length === 1) return {type:'sub', pos:posOf(d[0],ta.length), from:ta[d[0]], to:tb[d[0]], idx:d[0]};
      return null;
    }
    if (Math.abs(ta.length - tb.length) === 1) {
      const long = ta.length > tb.length ? ta : tb;
      const short = ta.length > tb.length ? tb : ta;
      for (let i = 0; i < long.length; i++) {
        const cut = long.filter((_,j) => j !== i);
        if (cut.length === short.length && cut.every((x,j) => x === short[j])) {
          return {type:ta.length > tb.length ? 'drop' : 'add', pos:posOf(i,long.length), idx:i, unit:long[i]};
        }
      }
    }
  }
  return null;
}

const POS_LABEL = {
  first:'첫소리가 바뀌었어요',
  mid:'가운데 소리가 바뀌었어요',
  last:'끝소리가 바뀌었어요',
  addE:'끝에 e가 붙었어요 (마법의 e)',
  dropE:'끝의 e가 빠졌어요',
  add:'소리 하나가 더해졌어요',
  drop:'소리 하나가 빠졌어요'
};
function diffKey(d) {
  if (!d) return null;
  if (d.type === 'sub') return d.pos;
  if (d.type === 'addE' || d.type === 'dropE') return d.type;
  return d.type;   // add / drop
}

// 같은 시드로 같은 섞임이 나오게 하는 난수 (재시작 후에도 복원이 쉬워요)
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  const keys = us.map(u => u.k);

  if (minSession(us) === 8) return 'cluster';
  const v = us.find(u => u.kind === 'v');
  return v ? v.k : '기타';
}

function validSession(ss) {
  if (!ss || !Array.isArray(ss.steps) || !ss.steps.length) return false;
  if (!(ss.i >= 0 && ss.i < ss.steps.length)) return false;
  return ss.steps.every(s => s && typeof s.t === 'string');
}

function normalize(o) {
  const f = fresh();
  const s = {...f, ...o};
  s.version = 2;
  s.daily = {date:o.daily?.date || '', words:Array.isArray(o.daily?.words) ? o.daily.words : [], attempts:+o.daily?.attempts || 0};
  s.learned = (Array.isArray(o.learned) ? o.learned : []).filter(id => ITEM(id));
  s.completed = (Array.isArray(o.completed) ? o.completed : []).filter(id => LESSONS.some(l => l.id === id));
  s.passed = o.passed && typeof o.passed === 'object' ? o.passed : {};
  s.mastery = o.mastery && typeof o.mastery === 'object' ? o.mastery : {};
  s.reviews = o.reviews && typeof o.reviews === 'object' ? o.reviews : {};
  Object.keys(s.reviews).forEach(id => { if (!ITEM(id) || !s.reviews[id] || !Number.isFinite(s.reviews[id].due)) delete s.reviews[id]; });
  s.sounds = o.sounds && typeof o.sounds === 'object' ? o.sounds : {};
  s.stats = o.stats && typeof o.stats === 'object' ? o.stats : {};
  s.attempts = Array.isArray(o.attempts) ? o.attempts.slice(-800) : [];
  s.aids = o.aids && typeof o.aids === 'object' ? o.aids : {};
  s.seen = Array.isArray(o.seen) ? o.seen : [];
  s.level = Math.max(0, Math.min(5, +s.level || 0));
  s.unlocked = Math.max(1, Math.min(5, +s.unlocked || 1));
  s.activeLevel = Math.max(1, Math.min(5, +s.activeLevel || 1));
  s.ch = {done:Array.isArray(o.ch?.done) ? o.ch.done : [], runs:o.ch?.runs || {}, delayed:o.ch?.delayed || null, started:Array.isArray(o.ch?.started) ? o.ch.started : []};
  s.pref = {short:!!o.pref?.short};
  if (!validSession(s.session)) s.session = null;
  if (!validSession(s.rsession)) s.rsession = null;
  if (!validSession(s.dsession)) s.dsession = null;
  if (s.test && !(s.test.answers && Array.isArray(s.test.answers))) s.test = null;
  return s;
}

// ----- v1 → v2 마이그레이션 (원본은 지우지 않고, 먼저 백업해요. 다시 실행해도 안전해요) -----
function migrate1to2(o) {
  const s = fresh();
  s.level = Math.max(0, Math.min(5, +o.level || 0));
  s.unlocked = Math.max(1, Math.min(5, +o.unlocked || 1));
  s.activeLevel = Math.max(1, Math.min(5, +o.activeLevel || 1));
  s.streak = +o.streak || 0;
  s.lastDay = o.lastDay || null;
  s.daily = {date:o.daily?.date || '', words:Array.isArray(o.daily?.ids) ? o.daily.ids.filter(id => ITEM(id)) : [], attempts:Array.isArray(o.daily?.ids) ? o.daily.ids.length : 0};
  s.learned = (Array.isArray(o.learned) ? o.learned : []).filter(id => ITEM(id));
  s.completed = (Array.isArray(o.completed) ? o.completed : []).filter(id => LESSONS.some(l => l.id === id));
  s.reviews = o.reviews && typeof o.reviews === 'object' ? o.reviews : {};
  Object.keys(s.reviews).forEach(id => { if (!ITEM(id) || !Number.isFinite(s.reviews[id]?.due)) delete s.reviews[id]; });
  s.sounds = o.sounds && typeof o.sounds === 'object' ? o.sounds : {};
  s.test = o.test && Array.isArray(o.test.answers) ? o.test : null;
  s.diagnosis = o.diagnosis || null;
  s.seen = s.learned.map(id => ITEM(id).w.toLowerCase());
  // 진행 중이던 세션은 남은 단어부터 새 방식으로 이어서 해요. (진행 위치만 보존해요)
  const old = o.session, paused = o.pausedSession;
  if (old && Array.isArray(old.ids) && old.ids.every(id => BYID[id]) && old.i < old.ids.length) {
    if (old.mode === 'review') s.rsession = {pending:{ids:old.ids.slice(old.i)}};
    else if (old.lessonId) s.session = {pending:{lessonId:old.lessonId, from:old.i}};
  }
  if (paused && Array.isArray(paused.ids) && paused.ids.every(id => BYID[id]) && paused.i < paused.ids.length && paused.lessonId && !s.session) {
    s.session = {pending:{lessonId:paused.lessonId, from:paused.i}};
  }
  s.migrated = {from:1, at:now()};
  return s;
}

function loadState() {
  const raw2 = lsGet(KEY2);
  if (raw2) {
    try {
      const o = JSON.parse(raw2);
      if (o && o.version === 2) return normalize(o);
    } catch { lsSet(BKC, raw2); }
  }
  const raw1 = lsGet(KEY1);
  if (raw1) {
    if (lsGet(BK1) === null) lsSet(BK1, raw1);           // 원본 백업 (이미 있으면 덮어쓰지 않아요)
    try {
      const o = JSON.parse(raw1);
      if (o && o.version === 1) return migrate1to2(o);
    } catch { lsSet(BKC+'-v1', raw1); }
  }
  return fresh();
}

// ----- 날짜, 연속 학습 -----
function rollDay() {
  const d = dateKey();
  if (S.daily.date !== d) { S.daily = {date:d, words:[], attempts:0}; save(); }
}
function streakNow() {
  if (!S.lastDay) return 0;
  return dayNumber(dateKey()) - dayNumber(S.lastDay) <= 1 ? S.streak : 0;
}
function touchActivity(id) {
  rollDay();
  const d = dateKey();
  if (S.lastDay !== d) {
    S.streak = dayNumber(d) - dayNumber(S.lastDay) === 1 ? S.streak + 1 : 1;
    S.lastDay = d;
  }
  if (id && !S.daily.words.includes(id)) S.daily.words.push(id);
}
function markSeen(words) {
  const set = new Set(S.seen);
  words.forEach(w => set.add(String(w).toLowerCase()));
  S.seen = [...set];
}

// ----- 복습 일정 -----
function due() {
  const t = now();
  return Object.entries(S.reviews)
    .filter(([id,r]) => ITEM(id) && Number.isFinite(r.due) && r.due <= t)
    .sort((a,b) => a[1].due - b[1].due)
    .map(([id]) => id);
}
// 정답: 예정 시간이 된 항목만 다음 간격으로. 오답: 10분 뒤로 초기화 (더 늦추지 않아요)
function schedule(id, ok, t=now()) {
  const r = S.reviews[id];
  if (!ok) {
    if (!r) { S.reviews[id] = {step:0, due:t+WRONG_DELAY, wrong:1, failed:true}; return; }
    r.step = 0; r.wrong = (r.wrong||0) + 1; r.failed = true;
    r.due = r.due <= t ? t + WRONG_DELAY : Math.min(r.due, t + WRONG_DELAY);
    return;
  }
  if (!r) { S.reviews[id] = {step:1, due:t+OK_INTERVALS[0], wrong:0, failed:false}; return; }
  if (r.due > t) return;                       // 아직 예정 시간 전: 자율 연습은 일정을 바꾸지 않아요
  r.step = Math.min((r.step||0) + 1, 4);
  r.due = t + OK_INTERVALS[r.step - 1];
  r.failed = false;
}

// ----- 응답 기록: 같은 답안(aid)은 한 번만 반영해요 -----
const newAid = () => 'a' + now().toString(36) + Math.random().toString(36).slice(2,8);
const METRIC_KEYS = ['selfread','choice','spell','decode','combo','comp','delayed'];
function metric(kind) { return S.stats[kind] || (S.stats[kind] = {n:0, first:0, unaided:0, helped:0}); }

function recordAttempt(q, ctx, sess) {
  if (!q || q.counted || S.aids[q.aid]) return false;
  q.counted = true;
  S.aids[q.aid] = now();
  const keys = Object.keys(S.aids);
  if (keys.length > 900) keys.sort((a,b) => S.aids[a]-S.aids[b]).slice(0, keys.length-700).forEach(k => delete S.aids[k]);

  const m = metric(q.kind);
  m.n++; if (q.first) m.first++; if (q.helped) m.helped++;
  const unaided = !!q.first && !q.helped && !q.silent;
  if (unaided) m.unaided++;

  S.attempts.push({aid:q.aid, t:now(), ctx, sid:sess?.sid || null, kind:q.kind, type:q.type, id:q.itemId || null, w:q.w || null, first:!!q.first, helped:!!q.helped, silent:!!q.silent});
  if (S.attempts.length > 800) S.attempts = S.attempts.slice(-800);

  rollDay();
  S.daily.attempts = (S.daily.attempts || 0) + 1;
  touchActivity(q.itemId || null);

  if (q.focus) {
    const so = S.sounds[q.focus] || (S.sounds[q.focus] = {tries:0, errors:0});
    so.tries++; if (!q.first) so.errors++;
  }
  if (q.itemId && ITEM(q.itemId) && q.sched !== false) {
    if ((ctx === 'lesson' || ctx === 'chapter') && !S.learned.includes(q.itemId)) S.learned.push(q.itemId);
    if (!(ctx === 'test' && q.first)) schedule(q.itemId, !!q.first);   // 진단에서 맞힌 것은 일정에 넣지 않아요
  }
  // 세션 안의 숙련 계산용 집계 (도움을 받았거나 소리 없이 진행한 문항은 정답으로 세지 않아요)
  const cat = q.cat || q.kind;
  if (sess && sess.m && ['choice','spell','decode'].includes(cat) && q.scored !== false) {
    sess.m.n++; if (unaided) sess.m.ok++;
  }
  if (sess && sess.m && cat === 'comp') { sess.m.comp.n++; if (q.first) sess.m.comp.ok++; if (q.helped) sess.m.comp.helped++; }
  return true;
}

function noteSelfRead(sess) {          // "소리 내어 읽었어요" 자기확인은 점수가 아니라 참여 기록이에요
  const m = metric('selfread'); m.n++;
  if (sess && sess.m) sess.m.selfread++;
  touchActivity(null);
}

// ----- 숙련 / 통과 판단 -----
function runQualifies(run, min, acc) { return run && run.n >= min && run.ok / run.n >= acc; }
function masteryOf(runs, min) {
  const good = (runs || []).filter(r => runQualifies(r, min, RULES.master));
  return new Set(good.map(r => r.sid)).size >= RULES.masterRuns;
}
function lessonMastered(id) { return masteryOf(S.mastery[id]?.runs, RULES.lessonMin); }
function chapterMastered(n) { return masteryOf(S.ch.runs[n], RULES.chapterMin); }
function levelLessons(l) { return LESSONS.filter(x => x.lv === l); }
function levelCompleted(l) { return levelLessons(l).every(x => S.completed.includes(x.id)); }
function levelPassed(l) { return levelLessons(l).every(x => S.passed[x.id]); }
function levelMastered(l) { return levelLessons(l).every(x => lessonMastered(x.id)); }
// 실전 챕터 추천: 5단계를 완료했고 도움 없는 확인 기록이 있거나, 진단이 최고 수준일 때 (참여만으로는 추천하지 않아요)
function chapterRecommended() {

}
function chapterDoneCount() { return S.ch.done.length; }
function delayedState() {
  const d = S.ch.delayed;
  if (!d) return null;
  if (d.status === 'done') return {...d, ready:false};

}
// 다음 날 확인: 다음 달력 날짜가 되고, 완료 시각에서 20시간 이상 지난 뒤부터 가능해요
function delayedDueAt(t=now()) {
  const d = new Date(t);
  const next = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1, 0, 0, 0, 0).getTime();
  return Math.max(t + 20*60*MIN, next);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a, rng=Math.random) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) { const j = Math.floor(rng()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; }
  return b;
}
let toastTimer;

// ===== 음성 (Web Speech API, en-US) =====
// 자동 음성 인식이나 발음 점수는 없어요. 단어와 문장 전체를 읽어주는 용도예요.
// 글자 하나의 소리는 기기 음성이 정확히 내기 어려워서, 예시 단어 전체를 재생해요.
const tts = {
  ok: false, fails: 0, started: false, voice: null, token: 0, timer: null
};
try {
  tts.ok = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
} catch { tts.ok = false; }

function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices() || [];
    return vs.find(v => v.lang === 'en-US') || vs.find(v => v.lang === 'en_US') || vs.find(v => /^en[-_]/i.test(v.lang)) || null;
  } catch { return null; }
}
if (tts.ok) {
  try {
    tts.voice = pickVoice();
    speechSynthesis.addEventListener?.('voiceschanged', () => { tts.voice = pickVoice(); });
  } catch { tts.ok = false; }
}
const ttsUsable = () => tts.ok && tts.fails < 3;

function stopSpeech() {
  tts.token++;
  clearTimeout(tts.timer);
  try { if (tts.ok) speechSynthesis.cancel(); } catch {}
  document.querySelectorAll('.speaking').forEach(e => e.classList.remove('speaking'));
}

// opts: {onBoundary(charIndex), onStart(), onEnd(), onFail()}
function speak(text, rate=1, opts={}) {
  if (!ttsUsable()) {
    toast('이 기기에서는 영어 소리를 낼 수 없어요. 글자 보기로 계속할 수 있어요.');
    opts.onFail?.();
    return;
  }
  stopSpeech();
  const token = tts.token;
  let u;
  try {
    u = new SpeechSynthesisUtterance(text);
  } catch { tts.fails = 3; opts.onFail?.(); return; }
  u.lang = 'en-US';
  u.rate = rate;
  const run = () => {
    if (token !== tts.token) return;
    tts.voice = tts.voice || pickVoice();
    if (tts.voice) u.voice = tts.voice;
    u.onstart = () => { tts.fails = 0; tts.started = true; opts.onStart?.(); };
    u.onend = () => { if (token === tts.token) opts.onEnd?.(); };
    u.onboundary = e => { if (token === tts.token && e.name !== 'sentence') opts.onBoundary?.(e.charIndex); };
    u.onerror = e => {
      if (token !== tts.token) return;
      if (['canceled','interrupted'].includes(e.error)) return;
      tts.fails++;
      toast('음성을 재생하지 못했어요. 기기의 영어 음성과 소리 설정을 확인하고 다시 눌러 주세요.');
      opts.onFail?.();
      if (!ttsUsable()) { try { render(); } catch {} }
    };
    try { speechSynthesis.speak(u); } catch { tts.fails++; opts.onFail?.(); }
  };
  // cancel() 직후 바로 speak()하면 일부 모바일 브라우저가 건너뛰어서 잠깐 기다려요.
  // 음성 목록이 늦게 로딩되는 기기를 위해 목록이 비어 있으면 조금 더 기다린 뒤 재생해요.
  const wait = (!tts.voice && !pickVoice()) ? 450 : 90;
  tts.timer = setTimeout(run, wait);
}

// 문장 재생: 단어 타이밍(boundary)을 지원하면 단어를, 아니면 문장 전체를 강조해요.
function speakSentence(text, rate, el, done) {
  if (!el) { speak(text, rate, {onEnd: done}); return; }
  const words = [...el.querySelectorAll('[data-wi]')];
  let gotBoundary = false;
  const clear = () => { el.classList.remove('speaking'); words.forEach(w => w.classList.remove('now')); };
  clear();
  const starts = [];
  let pos = 0;
  words.forEach(w => { const i = text.indexOf(w.textContent, pos); starts.push(i); pos = i + w.textContent.length; });
  speak(text, rate, {
    onStart: () => {
      el.classList.add('speaking');          // 단어 정보가 오기 전까지는 문장 단위로 강조
      setTimeout(() => { if (!gotBoundary) el.classList.add('sentence-on'); }, 700);
    },
    onBoundary: ci => {
      gotBoundary = true;
      el.classList.remove('sentence-on');
      let k = -1;
      starts.forEach((s,i) => { if (s <= ci) k = i; });
      words.forEach((w,i) => w.classList.toggle('now', i === k));
    },
    onEnd: () => { clear(); el.classList.remove('sentence-on'); done?.(); },
    onFail: () => { clear(); el.classList.remove('sentence-on'); }
  });
}

// ===== 활동 단계 만들기: 기존 레슨, 실전 챕터, 복습, 다음 날 확인 =====
const DG = ['sh','ch','th','ck'];
const KIND = {listenpick:'choice', pair:'choice', picture:'choice', first:'choice', meaning:'choice', odd:'choice',
  count:'choice', silent:'choice', chainpos:'choice', fill:'spell', build:'spell', chainbuild:'spell', type:'spell',
  sentorder:'spell', decode:'decode', comp:'comp'};
const NEEDS_AUDIO = ['listenpick','pair','first','fill','build','chainbuild','type','sentorder','decode'];
const RAW_WORDS = new Set([...Object.values(RAW).flat().map(r => r[0].toLowerCase()), ...SENTENCES.flatMap(s => tokensOf(s[0]))]);
const ALL_CHECK = new Set(CH.flatMap(c => c.check));

const sample = (a, n, rng=Math.random) => shuffle(a, rng).slice(0, n);
const uniq = a => [...new Set(a)];

// ----- 타일 -----
function tilesFor(word) {
  const us = wordUnits(word);
  if (us) return us.map(u => u.t);
  return word.toLowerCase().match(/sh|ch|th|ck|ee|oo|ng|qu|./g) || [];
}
function buildBank(word) {
  const tiles = tilesFor(word);
  const extra = [];
  const has = t => tiles.includes(t) || extra.includes(t);
  const vowelTile = tiles.some(t => t.length === 1 && 'aeiou'.includes(t));
  const dgTile = tiles.some(t => DG.includes(t));
  if (dgTile) extra.push(...sample(DG.filter(d => !has(d)), 1));
  if (vowelTile) extra.push(...sample('aeiou'.split('').filter(v => !has(v)), 1));
  const cons = 'mptsnrdb'.split('').filter(c => !has(c) && !(dgTile && ['s','h','c','t'].includes(c)));
  while (extra.length < 2) { const c = sample(cons.filter(x => !extra.includes(x)), 1)[0]; if (!c) break; extra.push(c); }
  return {tiles, bank: shuffle([...tiles, ...extra])};
}

// ----- 보기 -----
function simScore(a, b) {
  let s = 0;
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) if (a[i] === b[i]) s += 2;
  if (a.length === b.length) s += 1;
  uniq([...a]).forEach(c => { if (b.includes(c)) s += .5; });
  return s;
}
function similarOptions(w, pool, k=2) {
  const lw = w.toLowerCase();
  const c = uniq(pool.map(x => x.toLowerCase())).filter(x => x !== lw);
  c.sort((a,b) => simScore(lw,b) - simScore(lw,a));
  return sample(c.slice(0, Math.max(k+3, 6)), k);
}
const legacyPool = lv => uniq(ITEMS.filter(i => i.lv === lv && !i.sentence).map(i => i.w));
function chapterPool(n) {
  return Object.keys(LEX).filter(w => {
    const us = wordUnits(w);
    return us && minSession(us) <= n && !ALL_CHECK.has(w) && !us.some(u => u.kind === 'inf') && GLOSS[w];
  });
}
function optionsWithAnswer(correct, others) {
  const opts = shuffle([correct, ...others]);
  return {opts, a: opts.indexOf(correct)};
}

// ----- 단계 만들기 (질문형) -----
function stepListenPick(w, pool, extra={}) {
  const {opts, a} = optionsWithAnswer(w, similarOptions(w, pool, 2));
  return {t:'listenpick', w, opts, a, ...extra};
}
function stepPicture(w, pool, extra={}) {
  const {opts, a} = optionsWithAnswer(w, similarOptions(w, pool, 2));
  return {t:'picture', w, opts, a, ...extra};
}
function stepFirst(w, extra={}) {
  const c = w[0].toLowerCase();
  const same = {c:['k','q'], k:['c','q'], q:['c','k']}[c] || [];
  const others = sample('abdfghjlmnprstvwz'.split('').filter(x => x !== c && !same.includes(x)), 2);
  const {opts, a} = optionsWithAnswer(c, others);
  return {t:'first', w, opts, a, ...extra};
}
function stepMeaning(item, pool, extra={}) {
  const others = sample(uniq(pool.filter(i => i.ko !== item.ko && i.id !== item.id && i.sentence === item.sentence).map(i => i.ko)), 2);
  const {opts, a} = optionsWithAnswer(item.ko, others);
  return {t:'meaning', w:item.w, id:item.id, opts, a, ...extra};
}
function blankIndex(w) {
  const us = wordUnits(w);
  if (!us) return null;
  let i = us.findIndex(u => u.kind === 'dg');
  if (i < 0) i = us.findIndex(u => u.kind === 'se');
  if (i < 0) i = us.findIndex(u => u.kind === 'v');
  return i;
}
function stepFill(w, extra={}) {
  const us = wordUnits(w);
  if (!us) return stepFirst(w, extra);
  const i = blankIndex(w);
  const u = us[i];
  let pool;
  if (u.kind === 'dg') pool = DG;
  else if (u.kind === 'se') pool = ['e','a','o','i','u'];
  else pool = ['a','e','i','o','u'];
  const {opts, a} = optionsWithAnswer(u.t, sample(pool.filter(x => x !== u.t), 2));
  return {t:'fill', w, blank:i, opts, a, ...extra};
}
function stepBuild(w, extra={}) {
  const {tiles, bank} = buildBank(w);
  return {t:'build', w, tiles, bank, ...extra};
}
function stepType(w, extra={}) { return {t:'type', w, ...extra}; }
function stepCount(w, extra={}) {
  const us = wordUnits(w);
  const c = soundCount(us);
  const set = uniq([c, c-1 >= 2 ? c-1 : c+2, c+1]).slice(0,3);
  const {opts, a} = optionsWithAnswer(c, set.filter(x => x !== c).slice(0,2));
  return {t:'count', w, opts, a, ...extra};
}
function stepSilent(w, extra={}) {
  const tiles = tilesFor(w);
  const us = wordUnits(w);
  const si = us.findIndex(u => u.kind === 'se');
  const opts = [...tiles.map((t,i) => ({t, i})), {t:'없어요', i:-1}];
  return {t:'silent', w, tiles, opts:opts.map(o => o.t), a:si >= 0 ? si : tiles.length, ...extra};
}
function stepChainPos(a, b, extra={}) {
  const d = diffWords(a, b);
  const key = diffKey(d);
  const base = d.type === 'addE' ? ['addE','last','mid'] : d.type === 'dropE' ? ['dropE','last','mid'] : ['first','mid','last'];
  const opts = d.type === 'sub' ? base : shuffle(base);
  return {t:'chainpos', w:a, to:b, key, opts, a:opts.indexOf(key), ...extra};
}
function chainInstruction(a, b) {
  const d = diffWords(a, b);
  const posKo = {first:'첫소리', mid:'가운데 소리', last:'끝소리'};
  if (d.type === 'sub') return `${posKo[d.pos]}를 '${d.to}'로 바꿔요.`;
  if (d.type === 'addE') return `끝에 e를 붙여요. 마법의 e가 앞 모음을 길게 바꿔요.`;
  if (d.type === 'dropE') return `끝의 e를 빼요. 모음이 다시 짧아져요.`;
  if (d.type === 'add') return `'${d.unit}' 소리를 ${posKo[d.pos]} 자리에 더해요.`;
  return `'${d.unit}' 소리를 빼요.`;
}
function stepChainBuild(a, b, extra={}) {
  const {tiles, bank} = buildBank(b);
  return {t:'chainbuild', w:b, from:a, tiles, bank, ins:chainInstruction(a,b), ...extra};
}
function stepOdd(pairs, extra={}) {
  const magic = sample(pairs, 1)[0][1];
  const shorts = pairs.filter(p => p[1] !== magic).map(p => p[0]);
  const others = sample(shorts, 3);
  const {opts, a} = optionsWithAnswer(magic, others);
  return {t:'odd', w:magic, opts, a, ...extra};
}
function stepPair(p, extra={}) {
  const w = sample(p, 1)[0];
  const {opts, a} = optionsWithAnswer(w, p.filter(x => x !== w));
  return {t:'pair', w, opts, a, ...extra};
}
function decoysFor(w, n) {
  const us = wordUnits(w);
  const pool = Object.keys(LEX).filter(k => k !== w && !ALL_CHECK.has(k) && GLOSS[k] && minSession(wordUnits(k)) <= Math.max(n, 1) && !wordUnits(k).some(u => u.kind === 'inf'));
  const near = pool.filter(k => { const d = diffWords(w, k); return d && (d.type === 'sub'); });
  const picked = sample(near, 2);
  if (picked.length < 2) picked.push(...similarOptions(w, pool.filter(k => !picked.includes(k)), 2 - picked.length));
  return picked;
}
function stepDecode(w, n, extra={}) {
  const {opts, a} = optionsWithAnswer(w, decoysFor(w, n));
  return {t:'decode', w, opts, a, ...extra};
}
function stepSentOrder(item, extra={}) {
  const words = item.w.replace(/[.!?]/g,'').split(' ');
  const bank = shuffle(words.map((x,i) => x));
  return {t:'sentorder', w:item.w, id:item.id, tiles:words, bank, ...extra};
}
function stepComp(p, qi, extra={}) {
  const q = p.qs[qi];
  return {t:'comp', pid:p.id, qi, opts:q.o, a:q.a, text:q.q, ...extra};
}

// ----- 기존 1~5단계 레슨 -----
function lessonStepsFor(lesson, opts={}) {
  const lv = lesson.lv;
  const ids = lesson.ids.slice(opts.from || 0);
  const pool = legacyPool(lv);
  const items = ids.map(id => BYID[id]);
  const mkA = (it, i) => {
    const e = {id:it.id, ph:'새 단어 연습'};
    if (it.sentence) return stepMeaning(it, ITEMS.filter(x => x.sentence), e);
    if (lv === 1) return i % 3 === 0 ? stepFirst(it.w, e) : i % 3 === 1 ? stepPicture(it.w, pool, e) : stepListenPick(it.w, pool, e);
    return i % 2 ? stepPicture(it.w, pool, e) : stepListenPick(it.w, pool, e);
  };
  const mkB = (it, i) => {
    const e = {id:it.id, ph:'섞어서 확인'};
    if (it.sentence) return stepSentOrder(it, e);
    if (lv === 1) return [stepFirst(it.w, e), stepListenPick(it.w, pool, e), stepPicture(it.w, pool, e)][i % 3];
    if (lv === 2) return i % 2 ? stepFill(it.w, e) : stepBuild(it.w, e);
    if (lv === 3) return [stepBuild(it.w, e), stepFill(it.w, e), stepType(it.w, e)][i % 3];
    if (lv === 4) return [stepBuild(it.w, e), stepFill(it.w, e), stepSilent(it.w, e), stepType(it.w, e)][i % 4];
    return [stepType(it.w, e), stepBuild(it.w, e), stepListenPick(it.w, pool, e)][i % 3];
  };
  const steps = [];
  for (let g = 0; g < items.length; g += 4) {
    const grp = items.slice(g, g + 4);
    grp.forEach(it => steps.push({t:'intro', id:it.id, ph:'새 단어 만나기'}));
    grp.forEach((it,k) => steps.push(mkA(it, g + k)));
  }
  let finals = shuffle(items.map((it,i) => [it,i]));
  if (opts.short) finals = finals.slice(0, Math.max(4, Math.ceil(items.length / 2)));
  finals.forEach(([it,i]) => steps.push(mkB(it, i)));
  return steps;
}

function newSid() { return 's' + now().toString(36) + Math.random().toString(36).slice(2,6); }
function baseSession(kind, steps, extra={}) {
  return {kind, sid:newSid(), steps, i:0, started:now(), m:{n:0, ok:0, comp:{n:0, ok:0, helped:0}, selfread:0}, ...extra};
}
function makeLessonSession(lessonId, opts={}) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson) return null;
  const steps = lessonStepsFor(lesson, opts).map(s => ({...s, ctx:'lesson'}));
  return baseSession('lesson', steps, {lessonId, lv:lesson.lv, short:!!opts.short, label:`${lesson.lv}단계 · ${TITLES[lesson.lv]}`, resumed:!!opts.from});
}

// ----- 복습 -----
function reviewStep(id, i) {
  const it = ITEM(id);
  const e = {id, ph:'예정된 복습', ctx:'review'};
  if (it.sentence) return stepMeaning(it, ITEMS.filter(x => x.sentence), e);
  const pool = it.ch ? chapterPool(Math.max(1, it.ch)) : legacyPool(it.lv);
  if (it.ch || it.lv >= 2) return i % 2 ? stepListenPick(it.w, pool, e) : stepBuild(it.w, e);
  return i % 2 ? stepPicture(it.w, pool, e) : stepFirst(it.w, e);
}
function makeReviewSession(ids) {
  const steps = ids.map((id,i) => reviewStep(id, i));
  return baseSession('review', steps, {ids, label:'오늘의 복습'});
}

// ----- 실전 챕터 -----
const DUP_WORD = {1:'dad',2:'pup',3:'mom',4:'dad',5:'mom',6:'pip',7:'mom',8:'dad',9:'mom',10:'pip'};

function pickCheckWords(c) {
  const unseen = c.check.filter(w => !S.seen.includes(w) && !RAW_WORDS.has(w));
  const take = unseen.slice(0, 3);
  if (take.length >= 2) return {words:take, label:'처음 보는 단어'};
  const rest = c.check.filter(w => !take.includes(w));
  return {words:[...take, ...rest].slice(0, 3), label:'새로운 조합 연습'};
}

function chapterStepsFor(n, opts={}) {
  const c = CH[n-1];
  const short = !!opts.short;
  const pool = chapterPool(n);
  const steps = [];
  const P = (ph, mins) => ({ph, mins});
  const push = (s, p) => steps.push({...s, ph:p.ph, mins:p.mins});
  const phReview = P('예정된 복습', 4), phRule = P('핵심 규칙과 입 모양', 3), phChain = P('소리 상자와 단어 사슬', 5),
        phBuild = P('듣고 철자 조립', 4), phText = P('짧은 글 읽기와 뜻 확인', 6);

  // 1) 예정된 복습 (진행 중인 학습 세션과 별개로, 오늘 이미 예정된 항목만)
  due().slice(0, short ? 3 : 5).forEach((id,i) => push({...reviewStep(id, i), ctx:'review'}, phReview));

  // 2) 규칙과 입 모양: 답을 먼저 떠올리게 한 뒤 설명해요
  const magic = [5,6,7].includes(n);
  if (magic) {
    const mw = n === 5 ? ['cake','cap'] : n === 6 ? ['kite','kit'] : ['note','not'];
    mw.forEach(w => push(stepSilent(w), phRule));
  } else {
    c.counts.forEach(w => push(stepCount(w), phRule));
  }
  c.rules.forEach(r => push({t:'rulecard', k:r.k, ex:r.ex}, phRule));
  if (n === 8) push({t:'rulecard', k:'contrast', ex:'ship'}, phRule);
  if (n === 4) push({t:'rulecard', k:'thcompare', ex:'this'}, phRule);
  if (n === 9 || n === 10) push({t:'rulecard', k:'recap', ex:'cake'}, phRule);

  // 3) 소리 상자와 단어 사슬
  const boxWords = n === 8 ? ['ship','stop'] : [c.core[1], c.core[4]];
  (short ? boxWords.slice(0,1) : boxWords).forEach(w => push({t:'soundbox', w}, phChain));
  const ch1 = c.chains[0];
  const maxTr = short ? 2 : 4;
  const trans = (ch, max) => {
    const out = [];
    for (let i = 0; i < ch.length - 1 && out.length < max; i++) out.push([ch[i], ch[i+1]]);
    return out;
  };
  trans(ch1, maxTr).forEach(([a,b], i) => {
    const d = diffWords(a, b);
    const canPos = d && ['sub','addE','dropE'].includes(d.type);
    push(i % 2 === 0 && canPos ? stepChainPos(a, b) : stepChainBuild(a, b), phChain);
  });
  if (!short && c.chains[1]) trans(c.chains[1], 2).forEach(([a,b], i) => {
    const d = diffWords(a, b);
    push(i % 2 === 0 && d && ['sub','addE','dropE'].includes(d.type) ? stepChainPos(a, b) : stepChainBuild(a, b), phChain);
  });
  if (c.pairs.length) {
    (short ? c.pairs.slice(0,2) : c.pairs).forEach(p => push(stepPair(p), phChain));
    if (magic) push(stepOdd(c.pairs.filter(p => LEX[p[1]] && LEX[p[1]].includes('+'))), phChain);
  } else {
    sample(c.core, short ? 1 : 2).forEach(w => push(stepListenPick(w, pool), phChain));
  }

  // 4) 듣고 철자 조립 (+ 같은 글자가 두 번 필요한 단어, 처음 보는 단어 확인)
  const buildWords = sample(c.core, short ? 3 : 6);
  buildWords.forEach((w,i) => push(i === 4 ? stepFill(w) : stepBuild(w), phBuild));
  push(stepBuild(DUP_WORD[n]), phBuild);
  if (n >= 3 && !short) push(stepType(sample(c.core, 1)[0]), phBuild);
  const chk = pickCheckWords(c);
  chk.words.slice(0, short ? 2 : 3).forEach(w => push(stepDecode(w, n, {id:`n${n}:${w}`, label:chk.label}), phBuild));

  // 5) 짧은 글: 모범 읽기 → 따라 읽기 → 혼자 읽기 → 새 글 → 뜻 확인
  const pass = c.passage;
  if (c.pre.length) push({t:'precheck', words:c.pre}, phText);
  if (short) {
    push({t:'readfull', pid:pass.id, mode:'model', round:1}, phText);
    push({t:'readfull', pid:pass.id, mode:'solo', round:2}, phText);
  } else {
    pass.en.forEach((s,si) => push({t:'sent', pid:pass.id, si}, phText));
    push({t:'readfull', pid:pass.id, mode:'solo', round:1}, phText);
    push({t:'readfull', pid:pass.id, mode:'solo', round:2}, phText);
    push({t:'readfull', pid:c.tx.id, mode:'solo', round:1, transfer:true}, phText);
  }
  pass.qs.forEach((_,qi) => push(stepComp(pass, qi), phText));
  if (!short) c.tx.qs.forEach((_,qi) => push(stepComp(c.tx, qi, {transfer:true}), phText));

  // 6) 오늘 결과
  push({t:'summary'}, P('오늘 결과와 다음 복습 안내', 2));
  return {steps, check:chk};
}

function makeChapterSession(n, opts={}) {
  const c = CH[n-1];
  if (!c) return null;
  // 이 회차의 연습 단어를 "본 단어"로 기록해요 (새 단어 확인 후보와 겹치지 않게 보관)
  const {steps, check} = chapterStepsFor(n, opts);
  const stepsCtx = steps.map(s => {
    const cid = `c${n}:${s.w}`;
    const withId = !s.id && s.w && CHBYID[cid] && ['build','fill','listenpick','pair','chainbuild','type'].includes(s.t) ? {id:cid} : {};
    return {ctx:'chapter', ...s, ...withId};
  });
  const exposed = [...c.core, ...c.chains.flat(), ...c.pairs.flat(), ...c.rules.map(r => r.ex), ...c.passage.en.flatMap(tokensOf), ...c.tx.en.flatMap(tokensOf)];
  markSeen(exposed);
  markSeen(check.words);              // 확인한 단어는 다음부터 '처음 보는 단어'로 세지 않아요
  return baseSession('chapter', stepsCtx, {n, short:!!opts.short, label:`실전 ${n}회 · ${c.title}`, checkLabel:check.label});
}

// ----- 다음 날 확인 -----
function makeDelayedSession() {
  const steps = [];
  const P = {ph:'다음 날 기억 확인', mins:8};
  DELAYED.build.forEach(w => steps.push({...stepBuild(w), ...P, ctx:'delayed', delayed:true}));
  steps.push({t:'readfull', pid:DELAYED.passage.id, mode:'solo', round:1, ...P, ctx:'delayed'});
  DELAYED.passage.qs.forEach((_,qi) => steps.push({...stepComp(DELAYED.passage, qi), ...P, ctx:'delayed', delayed:true}));
  steps.push({t:'summary', ph:'다음 날 기억 확인', ctx:'delayed'});
  return baseSession('delayed', steps, {label:'다음 날 기억 확인'});
}

// 마이그레이션으로 남은 진행 위치를 실제 세션으로 바꿔요
function resolvePending() {
  if (S.session?.pending) {
    const p = S.session.pending;
    S.session = makeLessonSession(p.lessonId, {from:p.from});
  }
  if (S.rsession?.pending) {
    const ids = S.rsession.pending.ids.filter(id => ITEM(id));
    S.rsession = ids.length ? makeReviewSession(ids) : null;
  }
}

const progress = (n, total) => `

// ----- 질문 상태 -----
function qOf(step) {
  if (!step.q) {
    const item = step.id ? ITEM(step.id) : null;
    step.q = {
      aid:newAid(), type:step.t, cat:KIND[step.t] || 'info',
      kind:step.delayed ? 'delayed' : (step.t === 'decode' && step.label === '새로운 조합 연습') ? 'combo' : (KIND[step.t] || 'info'),
      w:step.w || null, itemId:step.id || null,
      focus:item ? item.focus : (step.w && wordUnits(step.w) ? focusOf(step.w) : null),
      sel:null, placed:[], typed:'', tries:0, first:null, ok:false, answered:false, helped:false,
      model:false, silent:false, counted:false, gaveUp:false, needModel:false, marks:null,
      scored:step.ctx !== 'review', msg:''
    };
  }
  return step.q;
}
function infoFor(step) {
  const it = step.id ? ITEM(step.id) : null;
  const lw = String(step.w || '').toLowerCase();
  return {ko:it ? it.ko : (GLOSS[lw] || FUNC[lw]?.ko || ''), emoji:it ? it.emoji : (EM[lw] || ''), hint:it?.hint || ''};
}

// ----- 철자 단위 / 소리 묶음 표시 -----
function unitRow(w, blank=-1) {
  const us = wordUnits(w) || tilesFor(w).map(t => ({t, kind:'c', sil:false}));
  return `<div class="urow" aria-label="${esc(w)}의 철자 단위">${us.map((u,i) =>
    `<span class="u ${u.kind} ${u.sil?'sil':''} ${i===blank?'blank':''}">${i===blank ? '＿' : esc(u.t)}</span>`).join('')}</div>`;
}
function soundRow(w) {
  const us = wordUnits(w);
  if (!us) return '';
  return `<div class="grow2" aria-label="소리 묶음">${soundGroups(us).map(g =>
    `<span class="g ${g.kind}">${esc(g.label)}</span>`).join('<span class="plus">+</span>')}</div>`;
}
function wordNotes(w) {
  const us = wordUnits(w);
  if (!us) return [];
  const notes = [];
  const dg = us.filter(u => u.kind === 'dg').map(u => u.t);
  if (dg.length) notes.push(`${uniq(dg).join(', ')}는 두 글자가 한 소리예요.`);
  for (let i = 0; i < us.length - 1; i++) {
    const a = us[i], b = us[i+1];
    if (a.kind === 'c' && b.kind === 'c') notes.push(`${a.t}${b.t}는 ${a.t}와 ${b.t}, 두 소리예요. (sh처럼 한 소리가 아니에요)`);
  }
  if (us.some(u => u.kind === 'se')) notes.push('끝의 e는 소리 내지 않고 앞 모음(a…e)을 길게 바꿔요.');
  if (us.some(u => u.kind === 'inf')) notes.push('끝의 s는 단어에 붙는 어미예요.');
  return uniq(notes);
}
function splitView(w) {
  const us = wordUnits(w);
  if (!us) return `<div class="word" lang="en">${esc(w)}</div>`;
  return `${unitRow(w)}${soundRow(w)}
    <p class="quiet">소리 ${soundCount(us)}개${wordNotes(w).map(n => ' · ' + n).join('')}</p>`;
}

// ----- 질문 화면 -----
function mutedNote() {
  return '<p class="quiet">이 기기에서는 영어 소리가 나오지 않아서 글자로 보여줘요. 이 문항은 숙련 기록에 넣지 않아요.</p>';
}
function promptAudio(step, q) {
  if (!ttsUsable()) { q.silent = true; return `<div class="word" lang="en">${esc(step.w)}</div>${mutedNote()}`; }
  return `<span class="emoji" aria-hidden="true">🎧</span>${audioRow(step.w)}`;
}

function passageHtml(p) {
  return `<p class="ptext" lang="en">${p.en.map(s => esc(s)).join(' ')}</p>`;
}

function targetHtml(step, q) {
  const info = infoFor(step);
  switch (step.t) {
    case 'listenpick': case 'pair': case 'first': return promptAudio(step, q);
    case 'picture': return `<span class="emoji" aria-hidden="true">${esc(info.emoji || '🔤')}</span>`;
    case 'meaning':
      return `<div class="word sentence" lang="en">${esc(step.w)}</div>` +
        (step.ctx === 'test' ? '<p class="quiet">소리 도움 없이 읽고 뜻을 골라요.</p>' : audioRow(step.w, true));
    case 'fill': return `${unitRow(step.w, step.blank)}${promptAudio(step, q)}`;
    case 'build': case 'type': case 'sentorder': return promptAudio(step, q);
    case 'chainbuild':
      return `<div class="word" lang="en">${esc(step.from)}</div><p class="hint">${esc(step.ins)}</p>` +
        (ttsUsable() ? audioRow(step.w) : '');
    case 'count':
      return `<div class="word" lang="en">${esc(step.w)}</div>${ttsUsable() ? audioRow(step.w) : ''}
        <p class="quiet">먼저 떠올려 보고 골라요. 틀려도 괜찮아요.</p>`;
    case 'silent': return `<div class="word" lang="en">${esc(step.w)}</div>${ttsUsable() ? audioRow(step.w) : ''}`;
    case 'chainpos': return `<div class="chainpair"><span class="word" lang="en">${esc(step.w)}</span><span aria-label="에서">→</span><span class="word" lang="en">${esc(step.to)}</span></div>`;
    case 'odd': return `<p class="hint">모음 소리가 길어지는 단어를 찾아요. 보기 옆 ▷로 들어봐도 좋아요.</p>`;
    case 'decode':
      if (!ttsUsable()) { q.silent = true; return `<div class="word" lang="en">${esc(step.w)}</div>${mutedNote()}`; }
      return `<p class="small">${esc(step.label || '처음 보는 단어')}</p><div class="word" lang="en">${esc(step.w)}</div>
        <p class="quiet">뜻을 몰라도 괜찮아요. 배운 규칙으로 읽으면 어떤 소리일까요? 소리를 들어보고 골라요.</p>`;
    case 'comp': {
      const p = PASSAGES[step.pid];
      const helpBtns = `
        <div class="helpbox">
          <button class="btn text" data-act="comp-hear" data-help="1">소리 도움 받기 (도움받고 해결로 기록)</button>
          <button class="btn text" data-act="comp-trans" data-help="1">${ui.trans[step.pid] ? '한국어 숨기기' : '한국어 번역 보기'} (도움받고 해결로 기록)</button>
        </div>`;
      return `${passageHtml(p)}${q.answered ? '' : helpBtns}${ui.trans[step.pid] ? `<p class="ptrans">${esc(p.ko.join(' '))}</p>` : ''}`;
    }
  }
  return '';
}

function optLabel(step, o, i) {

  if (step.t === 'decode') return (ttsUsable() && !step.q?.silent) ? `소리 ${i+1}` : o;

      <button class="choice ${selected?'selected':''} ${correct?'correct':''} ${wrong?'incorrect':''}"

        <span class="bubble">${correct?'✓':i+1}</span>
        <span class="${big?'word-choice':''}" ${['listenpick','pair','picture','odd','fill','first'].includes(step.t)?'lang="en"':''}>${esc(label)}</span>
      </button>`;
    if (!withSound) return btn;
    const say = typeof o === 'string' ? o : String(o);
    return `<div class="audio-choice">${btn}<button class="listen" data-say="${esc(say)}" data-rate="0.6" aria-label="소리 ${i+1} 느리게 듣기">▷ 듣기</button></div>`;
  }).join('')}</div>`;
}

// 타일/칸 조작: 드래그 없이 누르기만으로 만들 수 있어요
function tilesHtml(step, q) {
  const locked = q.answered || q.needModel;
  const n = step.tiles.length;
  const marks = q.marks || [];
  const slots = Array.from({length:n}, (_,k) => {
    const filled = q.placed[k] !== undefined;
    const text = filled ? step.bank[q.placed[k]] : '';
    const cls = q.answered && q.ok ? 'good' : marks[k] || '';
    return `<button class="slot ${filled?'filled':''} ${cls}" data-act="slot" data-k="${k}" ${locked?'disabled':''}
      aria-label="칸 ${k+1}: ${filled ? esc(text) + ' (누르면 빼요)' : '비어 있음'}">${esc(text)}</button>`;
  }).join('');
  const bank = step.bank.map((t,i) => {
    const used = q.placed.includes(i);
    return `<button class="tile ${used?'used':''}" data-act="tile" data-i="${i}" aria-pressed="${used}" ${locked?'disabled':''}
      ${used ? 'aria-label="' + esc(t) + ' (놓음, 누르면 취소)"' : ''}>${esc(t)}</button>`;
  }).join('');
  return `
    <div class="slots" aria-label="만드는 중인 ${step.t==='sentorder'?'문장':'단어'}">${slots}</div>
    <div class="bank" role="group" aria-label="타일 보기">${bank}</div>
    <div class="tools">
      ${act('← 한 칸 지우기','undo','btn small-btn', locked||!q.placed.length?'disabled':'')}
      ${act('전체 지우기','clear','btn small-btn', locked||!q.placed.length?'disabled':'')}
    </div>`;
}
function typeHtml(step, q) {

function whyHtml(step) {

function questionView(step, q, sess) {
  const tileLike = ['build','chainbuild','sentorder'].includes(step.t);
  const isType = step.t === 'type';
  let body = `<h2>${esc(HEAD[step.t] || '')}</h2>`;

function helpHtml(step, q) {

function questionControls(step, q) {

  if (q.answered) return primary('다음으로 →', 'next', `data-i="${sid}"`);

  }
  return `${act('확인하기','check','btn primary', q.sel === null ? 'disabled' : '')}${act('아직 모르겠어요','unknown','btn text')}`;

function exampleOf(k) {

}
function soundTiles(step) {

  if (it.sentence) return it.w.replace(/[.!?]/g,'').split(' ').map(t => ({label:t, say:t, hint:''}));
  if (it.lv === 5) return [{label:it.w, say:it.w, hint:'단어 전체 소리'}];
  if (it.lv === 1) {
    const k = it.focus;
    return [{label:k, key:k, ex:exampleOf(k), hint:SOUNDS[k]?.[0] || ''}];
  }
  const us = wordUnits(it.w);
  if (us) return soundGroups(us).map(g => ({label:g.label, key:g.k, ex:exampleOf(g.k), hint:SOUNDS[g.k]?.[0] || '', silentE:false}));
  return tilesFor(it.w).map(t => ({label:t, key:t, ex:exampleOf(t), hint:SOUNDS[t]?.[0] || ''}));
}

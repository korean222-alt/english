  let body = '', controls = '';
  switch (step.t) {
    case 'intro': body = introView(step); controls = primary('다음으로 →', 'next', `data-i="${sess.i}"`); break;
    case 'rulecard': body = ruleCardView({...step, n:sess.n}); controls = primary('다음으로 →', 'next', `data-i="${sess.i}"`); break;
    case 'soundbox': body = soundBoxView(step); controls = primary('다음으로 →', 'next', `data-i="${sess.i}"`); break;
    case 'precheck': body = precheckView(step); controls = primary('다음으로 →', 'next', `data-i="${sess.i}"`); break;
    case 'sent': body = sentView(step, sess); controls = primary('따라 읽었어요 →', 'readdone', `data-i="${sess.i}" ${step.done?'disabled':''}`) + '<p class="quiet">직접 읽었다는 표시는 참여 기록이에요. 채점은 하지 않아요.</p>'; break;
    case 'readfull': body = readFullView(step, sess); controls = readFullControls(step, sess); break;
    case 'summary': body = '<div class="study card"><p class="hint">오늘 학습을 마쳤어요.</p></div>'; controls = primary('결과 보기 →', 'finish', `data-i="${sess.i}"`); break;
    default: body = questionView(step, q, sess); controls = questionControls(step, q);
  }
  return `${runHeader(sess, step)}${body}${controls}`;
}

function runView() {
  const sess = S[runSlot];
  if (!sess) { page = 'home'; return homeView(); }
  const step = sess.steps[sess.i];
  if (!step) { return `<div class="study card"><p class="hint">학습이 끝났어요.</p></div>${primary('결과 보기 →','finish')}`; }
  return stepView(sess, step);
}

// ===== 버튼 동작: 답 확인, 타일 조작, 진행, 마무리 =====
let passTok = 0, lastAdv = -1e9;
const tapGuard = () => (typeof window.__tapGuard === 'number' ? window.__tapGuard : 350);
const tooFast = () => performance.now() - lastAdv < tapGuard();   // 같은 자리를 두 번 눌러 다음 화면까지 넘기는 일을 막아요
const curSess = () => (page === 'run' ? S[runSlot] : null);
function curStep() {
  if (page === 'test') return S.test?.current || null;
  const s = curSess();
  return s ? s.steps[s.i] : null;
}
function persist() { save(); }
function refresh(focus=false) { render(focus); }

const sameText = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

// ----- 답 처리 공통 -----
function finishQuestion(step, q) {
  stopSpeech();
  q.answered = true;
  const sess = curSess();
  recordAttempt(q, step.ctx || 'lesson', sess);
  if (page === 'test' && S.test) {
    if (!S.test.answers.some(a => a.aid === q.aid)) S.test.answers.push({aid:q.aid, tier:step.tier, ok:!!q.ok, wid:step.id || null});
    S.test.current = step;
  }
  persist();
  refresh();
}

function placeCorrect(step, q) {
  // 정답을 보여줄 때: 은행의 타일 중 정답 글자를 순서대로 놓아요
  const used = new Set(); const placed = [];
  step.tiles.forEach(t => {
    const idx = step.bank.findIndex((b,i) => b === t && !used.has(i));
    if (idx >= 0) { used.add(idx); placed.push(idx); }
  });
  q.placed = placed;
}

function checkOptions(step, q, unknown) {
  if (q.answered) return;
  q.tries++;
  q.ok = !unknown && q.sel === step.a;
  q.first = q.ok;
  q.gaveUp = !!unknown;
  finishQuestion(step, q);
}

function wrongMarks(step, q) {
  // 정답을 알려주지 않고 어느 칸이 다른지만 알려줘요
  const marks = step.tiles.map((t,k) => q.placed[k] === undefined ? '' : (step.bank[q.placed[k]] === t ? 'good' : 'bad'));
  const bad = marks.map((m,k) => m === 'bad' ? k + 1 : 0).filter(Boolean);
  return {marks, msg: bad.length ? `${bad.join(', ')}번째 칸을 다시 확인해요.` : '글자 순서를 다시 확인해요.'};
}

function checkTiles(step, q, unknown) {
  if (q.answered || q.needModel) return;
  if (unknown) {
    q.tries++; q.first = false; q.ok = false; q.gaveUp = true;
    placeCorrect(step, q); q.marks = null;
    finishQuestion(step, q);
    return;
  }
  if (q.placed.length !== step.tiles.length) return;
  q.tries++;
  const ok = step.tiles.every((t,k) => step.bank[q.placed[k]] === t);
  if (ok) {
    q.ok = true; q.first = q.tries === 1 && !q.modelSeen;
    q.marks = null;
    finishQuestion(step, q);
    return;
  }
  q.first = false;
  const r = wrongMarks(step, q);
  if (q.tries >= 3) {                               // 세 번째에도 어려우면 정답을 보여주고 넘어가요
    q.ok = false; q.gaveUp = true; placeCorrect(step, q); q.marks = null;
    finishQuestion(step, q);
    return;
  }
  q.marks = r.marks; q.msg = r.msg; q.needModel = true;
  persist(); refresh();
}

function checkTyped(step, q, unknown) {
  if (q.answered || q.needModel) return;
  if (unknown) {
    q.tries++; q.first = false; q.ok = false; q.gaveUp = true; q.typed = step.w;
    finishQuestion(step, q);
    return;
  }
  const typed = q.typed.trim().toLowerCase();
  if (!typed) return;
  q.tries++;
  if (typed === step.w.toLowerCase()) {
    q.ok = true; q.first = q.tries === 1 && !q.modelSeen;
    finishQuestion(step, q);
    return;
  }
  q.first = false;
  if (q.tries >= 3) { q.ok = false; q.gaveUp = true; q.typed = step.w; finishQuestion(step, q); return; }
  const w = step.w.toLowerCase();
  const bad = [];
  for (let i = 0; i < Math.max(w.length, typed.length); i++) if (w[i] !== typed[i]) bad.push(i + 1);
  q.msg = typed.length !== w.length
    ? `글자 수는 ${w.length}개예요. 소리를 하나씩 떠올리며 다시 써 봐요.`
    : `${bad.join(', ')}번째 글자를 다시 확인해요.`;
  q.needModel = true;
  persist(); refresh();
}

function doCheck(unknown=false) {
  const step = curStep();
  if (!step) return;
  const q = qOf(step);
  if (q.answered) return;
  if (['build','chainbuild','sentorder'].includes(step.t)) return checkTiles(step, q, unknown);
  if (step.t === 'type') return checkTyped(step, q, unknown);
  if (!unknown && q.sel === null) return;
  checkOptions(step, q, unknown);
}

function useModel() {
  const step = curStep(); if (!step) return;
  const q = qOf(step);
  if (!q.needModel) return;
  q.modelSeen = true; q.needModel = false; q.marks = null; q.msg = '';
  if (step.t === 'type') q.typed = ''; else q.placed = [];
  if (ttsUsable()) speak(step.w, 0.6);
  persist(); refresh();
  if (step.t === 'type') setTimeout(() => $('#typed')?.focus(), 50);
}

function markHelp() {
  const step = curStep(); if (!step) return;
  if (['intro','rulecard','soundbox','precheck','sent','readfull','summary'].includes(step.t)) { step.helped = true; return; }
  const q = qOf(step);
  if (!q.answered) q.helped = true;
}

// ----- 진행 -----
function advance() {
  stopSpeech(); passTok++;
  if (page === 'test') return nextTest();
  const sess = curSess(); if (!sess) return;
  ui.gloss = null; ui.caption = '';
  lastAdv = performance.now();
  sess.i++;
  if (sess.i >= sess.steps.length) { finalizeSession(); return; }
  persist(); refresh(true);
}

function leaveRun() {
  stopSpeech(); passTok++;
  persist();
  page = 'home';
  refresh(true);
}

// ----- 세션 마무리 -----
function accOf(m) { return m && m.n ? m.ok / m.n : 0; }

function finalizeSession() {
  const slot = runSlot, sess = S[slot];
  if (!sess) { page = 'home'; return refresh(true); }
  const m = sess.m || {n:0, ok:0, comp:{n:0, ok:0, helped:0}, selfread:0};
  const info = {kind:sess.kind, label:sess.label, n:m.n, ok:m.ok, comp:{...m.comp}, selfread:m.selfread, levelDone:false, lv:sess.lv || 0,
    short:!!sess.short, extra:[]};
  const t = now();

  if (sess.kind === 'lesson') {
    const id = sess.lessonId;
    if (!S.completed.includes(id)) S.completed.push(id);
    const rec = S.mastery[id] || (S.mastery[id] = {runs:[]});
    rec.runs.push({sid:sess.sid, n:m.n, ok:m.ok, t, short:!!sess.short});
    rec.runs = rec.runs.slice(-10);
    if (m.n >= RULES.passMin && accOf(m) >= RULES.pass) S.passed[id] = true;
    info.passed = !!S.passed[id];
    info.mastered = lessonMastered(id);
    const lv = sess.lv;
    if (levelCompleted(lv)) {
      info.levelDone = true;
      S.level = Math.max(S.level, lv);
      S.unlocked = Math.max(S.unlocked, Math.min(5, lv + 1));
      S.activeLevel = Math.min(5, lv + 1);
      if (lv === 5) info.extra.push('실전 챕터가 열렸어요. 짧은 글 읽기까지 이어가 봐요.');
    }
  } else if (sess.kind === 'chapter') {
    const n = sess.n;
    if (!S.ch.done.includes(n)) S.ch.done.push(n);
    (S.ch.runs[n] = S.ch.runs[n] || []).push({sid:sess.sid, n:m.n, ok:m.ok, t, short:!!sess.short});
    S.ch.runs[n] = S.ch.runs[n].slice(-10);
    info.mastered = chapterMastered(n);
    info.chapter = n;
    if (n === 10 && (!S.ch.delayed || S.ch.delayed.status === 'done')) {
      S.ch.delayed = {status:'pending', createdAt:t, dueAt:delayedDueAt(t)};
      info.extra.push('다음 날 기억 확인이 예약됐어요. 내일 이후에 열려요.');
    }
  } else if (sess.kind === 'delayed') {
    const d = S.ch.delayed;
    if (d && d.status !== 'done' && sess.started >= d.dueAt) {
      d.status = 'done';
      d.result = {n:m.n, ok:m.ok, comp:{...m.comp}, at:t};
    } else {
      info.extra.push('아직 예정된 시간이 되지 않아 결과를 기록하지 않았어요.');
    }
  }
  S[slot] = null;
  finishInfo = info;
  page = 'finish';
  stopSpeech(); passTok++;
  persist();
  refresh(true);
  celebrate();
}

// ----- 시작 -----
function nextLesson() {
  return LESSONS.find(l => l.lv === S.activeLevel && !S.completed.includes(l.id))
    || LESSONS.find(l => l.lv <= S.unlocked && !S.completed.includes(l.id));
}
function openRun(slot) {
  runSlot = slot; page = 'run';
  ui.trans = {}; ui.gloss = null; ui.helpOpen = {}; ui.caption = '';
  refresh(true);
}
function startLesson(id, short=false) {
  const l = LESSONS.find(x => x.id === id);
  if (!l || l.lv > S.unlocked) return;
  const prev = LESSONS.find(x => x.lv === l.lv && x.n === l.n - 1);
  if (prev && !S.completed.includes(prev.id)) return;
  if (S.session) {
    if (S.session.lessonId === id) return openRun('session');
    toast('진행 중인 학습이 있어요. 홈에서 이어서 마무리하거나 접어둔 뒤 시작해요.');
    return;
  }
  S.session = makeLessonSession(id, {short});
  S.activeLevel = l.lv;
  persist();
  openRun('session');
}
function startChapter(n, short=false) {
  if (n > 1 && !S.ch.done.includes(n - 1)) return;
  if (S.session) {
    if (S.session.kind === 'chapter' && S.session.n === n) return openRun('session');
    toast('진행 중인 학습이 있어요. 홈에서 이어서 마무리하거나 접어둔 뒤 시작해요.');
    return;
  }
  if (!S.ch.started.includes(n)) S.ch.started.push(n);
  S.session = makeChapterSession(n, {short});
  persist();
  openRun('session');
}
function startLearning() {
  if (S.session) return openRun('session');
  const l = nextLesson();
  if (l) startLesson(l.id);
  else if (chapterRecommended() && S.ch.done.length < 10) startChapter(S.ch.done.length + 1);
  else navigate('review');
}
function startReview() {
  if (S.rsession) return openRun('rsession');
  const ids = due().slice(0, 10);
  if (!ids.length) { refresh(); return; }
  S.rsession = makeReviewSession(ids);
  persist();
  openRun('rsession');
}
function startDelayed() {
  if (S.dsession) return openRun('dsession');
  const d = delayedState();
  if (!d || d.status === 'done' || !d.ready) { toast('아직 열리지 않았어요. 예정된 시간이 지나면 열려요.'); return; }
  S.dsession = makeDelayedSession();
  persist();
  openRun('dsession');
}
function discardSession(slot) {
  S[slot] = null;
  ui.confirm = null;
  persist();
  refresh();
}

// ----- 진단 -----
function startTest() {
  if (!S.test) S.test = {tier:0, run:0, answers:[], used:[], current:null};
  page = 'test';
  if (!S.test.current) buildTestStep();
  refresh(true);
}
function buildTestStep() {
  const t = S.test;
  const lv = t.tier + 1;
  const okw = w => w.lv === lv && (t.tier === 4 ? w.sentence : !w.sentence) && (t.tier !== 0 || w.focus !== 'x');
  let pool = ITEMS.filter(w => okw(w) && !t.used.includes(w.id));
  if (!pool.length) pool = ITEMS.filter(okw);
  const w = shuffle(pool)[0];
  const e = {id:w.id, ctx:'test', tier:t.tier, ph:'내 영어 실력 알아보기'};
  let step;
  if (t.tier === 0) step = stepFirst(w.w, e);
  else if (t.tier === 4) step = stepMeaning(w, ITEMS.filter(x => x.sentence), e);
  else if (t.answers.length % 2 && ttsUsable()) step = stepListenPick(w.w, legacyPool(lv), e);
  else step = stepPicture(w.w, legacyPool(lv), e);
  t.used.push(w.id);
  t.current = step;
  persist();
  return step;
}
function nextTest() {
  const t = S.test;
  const step = t?.current;
  const q = step?.q;
  if (!t || !q || !q.answered || q.advanced) return;
  q.advanced = true;
  if (t.answers.length >= 15) {
    let level = 0;
    for (let tier = 0; tier < 5; tier++) {
      const a = t.answers.filter(x => x.tier === tier);
      if (a.length >= 2 && a.filter(x => x.ok).length / a.length >= .67 && level === tier) level = tier + 1;
      else break;
    }
    const weak = [0,1,2,3,4].filter(i => t.answers.some(a => a.tier === i && !a.ok));
    S.diagnosis = {level, weak, date:dateKey(), answered:t.answers.length};
    S.level = Math.max(S.level, level);
    S.unlocked = Math.max(S.unlocked, Math.min(5, level + 1));
    S.activeLevel = Math.min(5, Math.max(S.activeLevel, level + 1));
    S.test = null;
    page = 'result';
    persist(); refresh(true);
    return;
  }
  if (q.ok) { t.run++; if (t.run >= 2) { t.tier = Math.min(4, t.tier + 1); t.run = 0; } }
  else { t.tier = Math.max(0, t.tier - 1); t.run = 0; }
  t.current = null;
  buildTestStep();
  refresh(true);
}

// ----- 글 읽기 재생 -----
function playPassage(pid, rate) {
  const p = PASSAGES[pid]; if (!p) return;
  const els = [...document.querySelectorAll('#pass-el [data-si]')];
  const tok = ++passTok;
  let i = 0;
  const next = () => {
    if (tok !== passTok || i >= p.en.length) return;
    const k = i++;
    speakSentence(p.en[k], rate, els[k], next);
  };
  next();
}

// ----- 클릭 처리 -----
function glossFor(w) {
  const lw = w.toLowerCase();
  const ko = GLOSS[lw] || FUNC[lw]?.ko || '';
  return ko ? `${w}: ${ko}` : `${w}: 이 단어는 소리만 들려줄게요.`;
}

function onAct(act, el) {
  const step = curStep();
  switch (act) {
    case 'pick': {
      if (!step) return; const q = qOf(step);
      if (q.answered || q.needModel) return;
      q.sel = +el.dataset.i; persist(); refresh(); return;
    }
    case 'check': return doCheck(false);
    case 'unknown': return doCheck(true);
    case 'model': return useModel();
    case 'tile': {
      if (!step) return; const q = qOf(step);
      if (q.answered || q.needModel) return;
      const i = +el.dataset.i;
      const at = q.placed.indexOf(i);
      if (at >= 0) q.placed.splice(at, 1);
      else if (q.placed.length < step.tiles.length) q.placed.push(i);
      q.marks = null; persist(); refresh(); return;
    }
    case 'slot': {
      if (!step) return; const q = qOf(step);
      if (q.answered || q.needModel) return;
      const k = +el.dataset.k;
      if (q.placed[k] !== undefined) { q.placed.splice(k, 1); q.marks = null; persist(); refresh(); }
      return;
    }
    case 'undo': {
      if (!step) return; const q = qOf(step);
      if (q.answered || q.needModel) return;
      q.placed.pop(); q.marks = null; persist(); refresh(); return;
    }
    case 'clear': {
      if (!step) return; const q = qOf(step);
      if (q.answered || q.needModel) return;
      q.placed = []; q.marks = null; persist(); refresh(); return;
    }
    case 'hint': {
      if (!step) return; const q = qOf(step);
      q.helpShown = true; q.helped = true; persist(); refresh(); return;
    }
    case 'comp-hear': {
      const q = qOf(step); q.helped = true; persist();
      const p = PASSAGES[step.pid]; speak(p.en.join(' '), 0.8); return;
    }
    case 'comp-trans': {
      const q = qOf(step); q.helped = true;
      ui.trans[step.pid] = !ui.trans[step.pid]; persist(); refresh(); return;
    }
    case 'trans-sent': { const k = el.dataset.key; ui.trans[k] = !ui.trans[k]; refresh(); return; }
    case 'trans-pass': { step.helped = true; const k = el.dataset.key; ui.trans[k] = !ui.trans[k]; persist(); refresh(); return; }
    case 'help-toggle': {
      const sess = curSess(); step.helped = true;
      ui.helpOpen[sess.i] = !ui.helpOpen[sess.i]; persist(); refresh(); return;
    }
    case 'pass-play': return playPassage(step.pid, 0.6);
    case 'pass-play-fast': return playPassage(step.pid, 1);
    case 'pass-play-help': step.helped = true; persist(); return playPassage(step.pid, 0.8);
    case 'extra-read': {
      const sess = curSess();
      if (step.done || +el.dataset.i !== sess.i && el.dataset.i) return;
      sess.steps.splice(sess.i + 1, 0, {...step, round:3, extra:true, done:false, helped:false});
      step.done = true; noteSelfRead(sess); advance(); return;
    }
    case 'readdone': case 'next': case 'finish': {
      const sess = curSess();
      if (page === 'test') return nextTest();
      if (!sess) return;
      if (el.dataset.i !== undefined && +el.dataset.i !== sess.i) return;     // 같은 화면의 중복 탭 방지
      if (tooFast()) return;
      if (act === 'readdone') {
        if (step.done) return;
        step.done = true; noteSelfRead(sess);
      }
      if (act === 'finish') { if (step.t !== 'summary') return; return finalizeSession(); }
      if (['listenpick','pair','picture','first','meaning','fill','build','chainbuild','type','count','silent','chainpos','odd','decode','sentorder','comp'].includes(step.t)
          && !(step.q && step.q.answered)) return;
      return advance();
    }
    case 'exit': return leaveRun();
  }
}

function onAction(a, el) {
  if (['home','courses','review','records'].includes(a)) { navigate(a); return; }
  switch (a) {
    case 'start-learning': return startLearning();
    case 'start-review': return startReview();
    case 'start-test': return startTest();
    case 'start-delayed': return startDelayed();
    case 'resume': return openRun(el.dataset.slot);
    case 'chapter-open': chapterOpen = true; courseLevel = 0; page = 'courses'; refresh(true); return;
    case 'chapter-close': chapterOpen = false; refresh(true); return;
    case 'discard': {
      const slot = el.dataset.slot;
      if (ui.confirm === slot) return discardSession(slot);
      ui.confirm = slot; refresh();
      setTimeout(() => { if (ui.confirm === slot) { ui.confirm = null; refresh(); } }, 5000);
      return;
    }
    case 'short-toggle': S.pref.short = !S.pref.short; persist(); refresh(); return;
    case 'next-test': return nextTest();
  }
}

function celebrate() {
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch {}
  for (let i = 0; i < 28; i++) {
    const e = document.createElement('i');
    e.className = 'confetti';
    e.style.cssText = `left:${Math.random()*100}%;background:${['#d9edab','#e9ab72','#267359','#e9d9a9'][i%4]};animation-delay:${Math.random()*.5}s`;
    document.body.append(e);
    setTimeout(() => e.remove(), 3100);
  }
}

function onClick(e) {
  const say = e.target.closest('[data-say]');
  if (say) {
    const text = say.dataset.say, rate = +(say.dataset.rate || 1);
    if (say.dataset.help) markHelp();
    if (say.dataset.cap) { ui.caption = say.dataset.cap; const c = $('#excap'); if (c) c.textContent = ui.caption; }
    if (say.dataset.sent) speakSentence(text, rate, $('#sent-el'));
    else speak(text, rate);
    return;
  }
  const g = e.target.closest('[data-gloss]');
  if (g) {
    const w = g.dataset.gloss;
    ui.gloss = glossFor(w);
    const c = $('#glosscap'); if (c) c.textContent = ui.gloss;
    const st = curStep(); if (st) st.helped = true;
    speak(w, 0.7);
    return;
  }
  const a = e.target.closest('[data-act]');
  if (a && a.tagName !== 'INPUT') { onAct(a.dataset.act, a); return; }
  const b = e.target.closest('[data-action]');
  if (b) {
    const act = b.dataset.action;
    if (['next','finish','readdone','check','unknown','exit'].includes(act)) onAct(act, b);
    else onAction(act, b);
    return;
  }
  const lv = e.target.closest('[data-level]');
  if (lv) { courseLevel = +lv.dataset.level; chapterOpen = false; refresh(true); return; }
  const ls = e.target.closest('[data-lesson]');
  if (ls) { startLesson(ls.dataset.lesson, ls.dataset.short === '1'); return; }
  const cs = e.target.closest('[data-chapter]');
  if (cs) { startChapter(+cs.dataset.chapter, cs.dataset.short === '1'); return; }
}

function onInput(e) {
  const t = e.target;
  if (t.matches?.('input[data-act="typed"]')) {
    const step = curStep(); if (!step) return;
    const q = qOf(step);
    if (q.answered || q.needModel) return;
    q.typed = t.value.replace(/[^A-Za-z]/g, '').slice(0, step.w.length + 3);
    if (t.value !== q.typed) t.value = q.typed;
    const btn = $('[data-act="check"]'); if (btn) btn.disabled = !q.typed.trim();
    persist();
  }
}
function onKey(e) {
  if (e.key === 'Enter' && e.target.matches?.('input[data-act="typed"]')) { e.preventDefault(); doCheck(false); }
}

const METRIC_LABEL = {
  selfread:['소리 내어 읽었다고 표시','참여 기록이에요. 마이크로 채점하지 않아요.'],
  choice:['고르기 (듣고·그림·뜻)','객관식이라 우연히 맞힐 수 있어요.'],
  spell:['철자 조립·쓰기','타일·키보드로 직접 만든 답이에요.'],
  decode:['처음 보는 단어 읽기','앞서 보지 않은 단어를 규칙으로 읽기'],
  combo:['새로운 조합 연습','이미 접한 글자 조합을 새 단어에 적용'],
  comp:['짧은 글 이해','글을 읽고 한국어 질문에 답하기'],
  delayed:['다음 날 기억 확인','하루가 지난 뒤의 확인']
};
function metricRow(k) {
  const m = S.stats[k] || {n:0, first:0, unaided:0, helped:0};
  const [label, note] = METRIC_LABEL[k];
  if (k === 'selfread') return `<div class="mrow"><div><strong>${label}</strong><small>${note}</small></div><b>${m.n}회</b></div>`;
  const pct = m.n ? Math.round(m.unaided / m.n * 100) : 0;
  return `<div class="mrow"><div><strong>${label}</strong><small>${note}</small>
    <small>평가된 문항 ${m.n}개 · 도움 없이 첫 시도 정답 ${m.unaided}개 · 도움받고 해결 ${m.helped}개</small></div>
    <b>${m.n ? pct + '%' : '–'}</b></div>`;
}
function recordsView() {
  const weak = Object.entries(S.sounds).filter(([,r]) => r.errors > 0 && r.tries >= 2)
    .sort((a,b) => b[1].errors/b[1].tries - a[1].errors/a[1].tries).slice(0,5);
  const words = new Set(S.learned.filter(id => ITEM(id) && !ITEM(id).sentence).map(id => ITEM(id).w.toLowerCase())).size;
  const lessonsM = LESSONS.filter(l => lessonMastered(l.id)).length;
  const chM = CH.filter(c => chapterMastered(c.n)).length;
  const newCombo = (S.stats.decode?.n || 0) + (S.stats.combo?.n || 0);
  const dl = S.ch.delayed;
  return `
  <div class="intro">
    <div class="eyebrow">나의 작은 성취들</div>
    <h1>꾸준히 자라고 있어요.</h1>
    <p>서툰 소리도 연습하면 익숙해져요.</p>
  </div>
  <div class="stats">
    <div class="stat"><b>${S.level}</b><span>현재 레벨</span></div>
    <div class="stat"><b>${words}</b><span>배운 단어(서로 다른)</span></div>
    <div class="stat"><b>${streakNow()}</b><span>연속 학습일</span></div>
  </div>
  <div class="card">
    <h3>완료와 숙련은 따로 세요</h3>
    <p class="hint" style="margin-top:10px">완료한 레슨 ${S.completed.length} / ${LESSONS.length}개 · 숙련한 레슨 ${lessonsM}개<br>
      완료한 실전 회차 ${S.ch.done.length} / 10회 · 숙련한 회차 ${chM}회<br>
      연습한 횟수 ${S.attempts.length >= 800 ? '800+' : S.attempts.length}번 (같은 단어를 다시 연습해도 서로 다른 단어 수는 늘지 않아요)</p>
    <p class="quiet">숙련 = 도움 없이 첫 시도에 맞힌 비율이 80% 이상인 회차가 서로 다른 학습 2번. 제품의 기본값이며 과학적으로 검증된 기준은 아니에요.</p>
  </div>
  <div class="card" style="margin:16px 0">
    <h3>활동별 기록</h3>
    ${METRIC_KEYS.map(metricRow).join('')}
    <p class="quiet">정답률은 '도움 없이 첫 시도에 맞힌 비율'이에요. 소리가 나오지 않아 글자로 본 문항은 숙련에 넣지 않아요.</p>
  </div>
  <div class="card">
    <h3>처음 보는 단어·새 조합</h3>
    <p class="hint" style="margin-top:10px">평가된 문항 ${newCombo}개${dl ? `<br>다음 날 확인: ${dl.status==='done' ? '완료' : dl.status==='pending' ? (now() >= dl.dueAt ? '지금 열려 있어요' : fmtTime(dl.dueAt) + ' 이후') : ''}` : ''}</p>
  </div>
  <div class="card" style="margin:16px 0">
    <h3>조금 더 연습할 소리</h3>
    ${weak.length ? weak.map(([k,r]) => `
      <div class="weak"><strong>${esc(k==='th0'?'th':k.replace('_','…'))}</strong>${progress(r.errors, r.tries)}<small>${r.tries}회 중 ${r.errors}회</small></div>`).join('') :
      '<p class="hint" style="margin-top:14px">문제를 풀면 어려워한 소리를 모아드려요.</p>'}
    <p class="quiet">막대는 첫 시도에서 틀린 비율이에요. 많이 틀린 소리는 복습에서 다시 만나요.</p>
  </div>
  <div class="card" style="margin:16px 0">
    <h3>내 학습 기록</h3>
    <p class="hint" style="margin-top:10px">읽어본 문장 ${S.learned.filter(id=>ITEM(id)?.sentence).length}개<br>
      다시 연습 중인 항목 ${Object.values(S.reviews).filter(r=>r.failed).length}개</p>
  </div>
  <button class="btn" data-action="start-test">${S.test?'진행 중인 레벨 테스트 이어하기':'레벨 테스트 다시 보기'}</button>
  <p class="note">레벨은 진단과 코스 완료를 기준으로 갱신해요.<br>기록은 이 브라우저에만 저장돼요. 다른 기기와 동기화되지 않아요.<br>
    따라 읽기는 녹음하거나 자동 채점하지 않아요. 이 앱의 효과가 검증됐다고 말하지 않아요.</p>`;
}

// ----- 진단 -----
function testView() {
  if (!S.test) { page = 'home'; return homeView(); }
  if (!S.test.current) buildTestStep();
  const step = S.test.current;
  const q = qOf(step);
  const count = S.test.answers.length;
  return `
  <div class="flow-top"><button class="icon-btn" data-action="home" aria-label="진단 저장하고 홈으로">×</button>${progress(count, 15)}</div>
  <div class="flow-meta"><span>내 영어 실력 알아보기 · 약 3분</span><span>${Math.min(15, count + (q.answered ? 0 : 1))} / 15</span></div>
  ${questionView(step, q, null)}
  ${questionControls(step, q)}
  <p class="note">틀리면 더 쉬운 소리부터 다시 확인해요.<br>학습 시작점을 찾는 간단한 진단이며 공식 어학 시험은 아니에요.</p>`;
}
function resultView() {
  const d = S.diagnosis;
  if (!d) return homeView();
  const descriptions = [
    '글자와 소리를 연결하는 연습부터 시작해요. 알파벳 이름을 외우는 것보다 입으로 소리 내는 연습이 도움이 돼요.',
    '기본 글자 소리가 조금 익숙해요. 이제 짧은 모음을 구분하고 세 글자를 이어 읽어봐요.',
    '짧은 단어를 읽는 기반이 있어요. 두 글자가 한 소리를 내는 규칙을 만나봐요.',
    '자음 묶음을 읽는 힘이 있어요. 다음에는 긴 모음과 마법의 e를 연습해요.',
    '다양한 단어 소리가 익숙해요. 자주 쓰는 단어를 문장 속에서 읽어봐요.',
    '짧은 문장의 의미를 읽는 기반이 있어요. 실전 챕터에서 처음 보는 단어와 짧은 글을 읽어봐요.'
  ];
  return `
  <div class="celebration">
    <span class="medal" aria-hidden="true">🌱</span>
    <div class="eyebrow">15문제 진단 완료</div>
    <h1>나의 시작점은<br>레벨 ${d.level}</h1>
    <p>${descriptions[d.level]}</p>
  </div>
  <div class="card">
    <h3>이 부분을 함께 연습해요</h3>
    <p class="hint" style="margin-top:12px">${d.weak.length ? d.weak.map(i => TITLES[i+1]).join('<br>') : '이번 진단에서는 큰 어려움이 없었어요. 매일 조금씩 읽는 습관을 이어가요.'}</p>
    <p class="quiet" style="margin-top:12px">적은 문항으로 추정한 시작점이에요. 언제든 첫 단계부터 배워도 괜찮아요. 이전에 열린 코스와 학습 기록은 유지돼요.</p>
  </div>
  <div style="margin-top:22px">${primary('나에게 맞는 학습 시작 →','start-learning')}<button class="btn" data-action="courses">전체 코스 보기</button></div>`;
}

// ----- 마무리 -----
function finishView() {
  const f = finishInfo;
  if (!f) return homeView();
  const unaided = f.n ? `${f.n}개 중 ${f.ok}개를 도움 없이 첫 시도에 맞혔어요.` : '';
  const comp = f.comp && f.comp.n ? `글 이해 ${f.comp.n}문항 중 ${f.comp.ok}개를 첫 시도에 맞혔어요${f.comp.helped ? ` (도움받고 해결 ${f.comp.helped}개)` : ''}.` : '';
  const sr = f.selfread ? `소리 내어 읽기 ${f.selfread}번 표시했어요(참여 기록).` : '';
  const kindLine = f.kind === 'lesson' ? (f.mastered ? '이 레슨은 숙련 기준을 채웠어요.' : '완료했어요. 숙련은 다른 회차에서 한 번 더 도움 없이 풀어 보면 채워져요.')
    : f.kind === 'chapter' ? (f.mastered ? '이 회차는 숙련 기준을 채웠어요.' : `실전 ${f.chapter}회를 완료했어요. 숙련은 별도로 계산해요.`)
    : f.kind === 'delayed' ? '하루가 지난 뒤의 기억을 확인했어요.' : '';
  return `
  <div class="celebration">
    <span class="medal" aria-hidden="true">${f.levelDone?'🏆':'🌿'}</span>
    <div class="eyebrow">오늘의 나에게 박수</div>
    <h1>${f.levelDone ? `${f.lv}단계를 완주했어요!` : '한 걸음 더 자랐어요!'}</h1>
    <p>${[unaided, comp, sr].filter(Boolean).join('<br>')}<br>틀린 항목은 복습 일정에 담아두었어요.<br>${esc(kindLine)}</p>
    <div class="pills"><span class="pill">🔥 ${streakNow()}일 연속</span><span class="pill">오늘 ${S.daily.words.length}개 연습</span></div>
    ${f.levelDone && f.lv < 5 ? '<p>다음 단계가 열렸어요. 차근차근 계속 가요.</p>' : ''}
    ${(f.extra || []).map(t => `<p>${esc(t)}</p>`).join('')}
    ${primary('오늘의 홈으로','home')}
    <button class="btn" data-action="courses">학습 코스 보기</button>
  </div>`;
}

// ===== 시작 =====
(function boot() {
  S = loadState();
  try { resolvePending(); } catch (err) { console.error(err); S.session = null; S.rsession = null; }
  rollDay();
  save();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopSpeech(); passTok++; save(); }
    else if (['home','review','records','courses'].includes(page)) render();
  });
  window.addEventListener('pagehide', () => { stopSpeech(); try { save(); } catch {} });
  setInterval(() => { if (!document.hidden && ['home','review'].includes(page)) render(); }, 30000);
  render();
})();

</script>
</body>
</html>
